<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração - Portal de Formulários</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .admin-container {
            width: 100%;
            max-width: 1200px;
            padding: 40px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-title h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: #1e293b;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .stat-card h3 {
            margin: 0;
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-card p {
            margin: 12px 0 0 0;
            font-size: 32px;
            font-weight: 700;
        }

        .admin-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .admin-content {
            background: #1e293b;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(0, 0, 0, 0.2);
            padding: 16px;
            font-size: 14px;
            color: #94a3b8;
            font-weight: 600;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-active {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .status-suspended {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }

        .status-banned {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-action.danger:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.2);
        }

        .loading-overlay {
            padding: 40px;
            text-align: center;
            color: #64748b;
        }

        .back-btn {
            text-decoration: none;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .back-btn:hover {
            color: #f8fafc;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #1e293b;
            padding: 32px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-content h2 {
            margin: 0 0 20px 0;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-family: inherit;
            box-sizing: border-box;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 32px;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #94a3b8;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-confirm {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-confirm.danger {
            background: #ef4444;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <header>
            <div class="header-title">
                <a href="index.html" class="back-btn"><i class="ph ph-arrow-left"></i> Dashboard</a>
                <h1><i class="ph ph-shield-checkered" style="color:#60a5fa;"></i> Painel de Administração</h1>
            </div>
            <div id="admin-user-info"></div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Utilizadores</h3>
                <p id="stat-users">-</p>
            </div>
            <div class="stat-card">
                <h3>Total Formulários</h3>
                <p id="stat-forms">-</p>
            </div>
            <div class="stat-card">
                <h3>Versão Sistema</h3>
                <p>1.0.0</p>
            </div>
        </div>

        <div class="admin-tabs">
            <button class="tab-btn active" onclick="switchTab('users')">Utilizadores</button>
            <button class="tab-btn" onclick="switchTab('forms')">Formulários Globais</button>
        </div>

        <div class="admin-content" id="admin-content">
            <div class="loading-overlay">
                <i class="ph ph-spinner ph-spin" style="font-size: 32px;"></i>
                <p>A carregar dados do sistema...</p>
            </div>
        </div>
    </div>

    <!-- Suspend Modal -->
    <div id="modal-suspend" class="modal-overlay">
        <div class="modal-content">
            <h2>Suspender Utilizador</h2>
            <div class="form-group">
                <label>Razão da Suspensão</label>
                <textarea id="suspend-reason" placeholder="Descreve o motivo..."></textarea>
            </div>
            <div class="form-group">
                <label>Suspender até (Data/Hora)</label>
                <input type="datetime-local" id="suspend-until">
                <p style="font-size:12px; color:#64748b; margin-top:4px;">Deixa vazio para suspensão por tempo
                    indeterminado.</p>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModals()">Cancelar</button>
                <button class="btn-confirm" id="btn-do-suspend">Suspender</button>
            </div>
        </div>
    </div>

    <!-- Ban Modal -->
    <div id="modal-ban" class="modal-overlay">
        <div class="modal-content">
            <h2 style="color:#ef4444;">Banir Utilizador</h2>
            <div class="form-group">
                <label>Razão do Banimento</label>
                <textarea id="ban-reason" placeholder="Descreve o motivo..."></textarea>
            </div>
            <p style="font-size:14px; color:#ef4444; background:rgba(239,68,68,0.1); padding:12px; border-radius:8px;">
                <i class="ph ph-warning"></i> Esta ação é permanente e impedirá o acesso total do utilizador.
            </p>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModals()">Cancelar</button>
                <button class="btn-confirm danger" id="btn-do-ban">Banir Permanentemente</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, onAuthStateChanged, collection, doc, getDoc, getDocs, updateDoc, query, orderBy, setDoc, where, deleteDoc, deleteField } from '/firebase-config.js';

        let currentTab = 'users';
        let filterUid = null;
        let filterEmail = '';
        let targetUid = null; // Para modais

        onAuthStateChanged(auth, async (user) => {
            const adminEmails = ['miguel.lopes@cruzvermelha.org.pt'];
            console.log("Admin: Current user email:", user?.email);
            
            if (!user || !user.email || !adminEmails.some(email => email.toLowerCase() === user.email.toLowerCase())) {
                console.warn("Admin: Access denied for", user?.email);
                window.location.href = 'index.html';
                return;
            }
            document.getElementById('admin-user-info').innerHTML = `<span style="color:#94a3b8; font-size:14px;">Logado como: <b>${user.email}</b></span>`;
            loadStats();
            loadTabData();
        });

        async function loadStats() {
            console.log("Admin: loadStats started");
            try {
                const usersSnap = await getDocs(collection(db, "users"));
                console.log("Admin: usersSnap loaded", usersSnap.size);
                const formsSnap = await getDocs(collection(db, "forms"));
                console.log("Admin: formsSnap loaded", formsSnap.size);
                document.getElementById('stat-users').innerText = usersSnap.size;
                document.getElementById('stat-forms').innerText = formsSnap.size;
            } catch (e) {
                console.error("Admin: Stats error:", e);
                document.getElementById('stat-users').innerText = "Err";
            }
        }

        window.switchTab = (tab) => {
            currentTab = tab;
            if (tab === 'users') filterUid = null; // Reset filter when going back to users
            document.querySelectorAll('.tab-btn').forEach(b => {
                const btnText = b.innerText.toLowerCase();
                b.classList.toggle('active', btnText.includes('utilizadores') ? tab === 'users' : tab === 'forms');
            });
            loadTabData();
        };

        async function loadTabData() {
            console.log("Admin: loadTabData started, currentTab:", currentTab, "filterUid:", filterUid);
            const content = document.getElementById('admin-content');
            content.innerHTML = '<div class="loading-overlay"><i class="ph ph-spinner ph-spin" style="font-size: 32px;"></i></div>';

            try {
                if (currentTab === 'users') {
                    console.log("Admin: Fetching users...");
                    const snap = await getDocs(collection(db, "users"));
                    console.log("Admin: Users fetched", snap.size);
                    let html = `<table><thead><tr><th>Utilizador</th><th>Status</th><th>Último Login</th><th>Ações</th></tr></thead><tbody>`;

                    // Client-side sort to avoid index requirement for now
                    const docs = [];
                    snap.forEach(docSnap => docs.push({ id: docSnap.id, ...docSnap.data() }));
                    docs.sort((a, b) => (b.lastLogin?.toMillis() || 0) - (a.lastLogin?.toMillis() || 0));

                    docs.forEach(u => {
                        const date = u.lastLogin ? u.lastLogin.toDate().toLocaleString('pt-PT') : 'N/A';
                        const statusClass = 'status-' + (u.status || 'active');
                        html += `
                            <tr style="cursor:pointer;" onclick="viewUserForms('${u.id}', '${u.email || 'Anónimo'}')">
                                <td>
                                    <div style="font-weight:600;">${u.email || 'Anónimo'}</div>
                                    <div style="font-size:12px; color:#64748b;">ID: ${u.id}</div>
                                </td>
                                <td><span class="status-badge ${statusClass}">${u.status || 'active'}</span></td>
                                <td>${date}</td>
                                <td class="action-btns">
                                    <button class="btn-action" title="Ver Formulários" onclick="event.stopPropagation(); viewUserForms('${u.id}', '${u.email || 'Anónimo'}')"><i class="ph ph-file-text"></i></button>
                                    ${u.status === 'active' || !u.status ?
                                `
                                        <button class="btn-action danger" onclick="event.stopPropagation(); openSuspendModal('${u.id}')" title="Suspender"><i class="ph ph-prohibit"></i></button>
                                        <button class="btn-action danger" onclick="event.stopPropagation(); openBanModal('${u.id}')" title="Banir"><i class="ph ph-warning-octagon"></i></button>
                                        ` :
                                `<button class="btn-action" data-btn-uid="${u.id}" onclick="event.stopPropagation(); setUserStatus('${u.id}', 'active', this)" title="Reativar"><i class="ph ph-check-circle" style="color:#10b981;"></i> Reativar</button>`
                            }
                                </td>
                            </tr>
                        `;
                    });
                    html += `</tbody></table>`;
                    content.innerHTML = html;
                } else {
                    let q = collection(db, "forms");
                    if (filterUid) {
                        q = query(q, where("uid", "==", filterUid));
                    }
                    const snap = await getDocs(q);

                    const filterHeader = filterUid ? `<div style="padding:16px; background:rgba(59,130,246,0.1); border-bottom:1px solid rgba(59,130,246,0.2); display:flex; justify-content:space-between; align-items:center;">
                        <span><i class="ph ph-user"></i> Formulários de: <b>${filterEmail}</b></span>
                        <button class="btn-action" onclick="switchTab('forms')" style="font-size:12px; padding:4px 10px;">Ver Todos</button>
                    </div>` : '';

                    let html = `${filterHeader}<table><thead><tr><th>Formulário</th><th>Dono</th><th>Atualizado</th><th>Ações</th></tr></thead><tbody>`;

                    const docs = [];
                    snap.forEach(docSnap => docs.push({ id: docSnap.id, ...docSnap.data() }));
                    docs.sort((a, b) => (b.updatedAt?.toMillis() || 0) - (a.updatedAt?.toMillis() || 0));

                    docs.forEach(f => {
                        const date = f.updatedAt ? f.updatedAt.toDate().toLocaleString('pt-PT') : 'Recente';
                        html += `
                            <tr>
                                <td>
                                    <div style="font-weight:600;">${f.title || 'Sem Título'}</div>
                                    <div style="font-size:12px; color:#64748b;">ID: ${f.id} | Slug: ${f.slug || 'N/A'}</div>
                                </td>
                                <td><div style="font-size:11px; color:#94a3b8; font-family:monospace;">${f.uid || 'Órfão'}</div></td>
                                <td>${date}</td>
                                <td class="action-btns">
                                    <button class="btn-action" onclick="window.open('view?id=${f.id}', '_blank')" title="Ver"><i class="ph ph-eye"></i></button>
                                    <button class="btn-action" onclick="window.location.href='builder.html?id=${f.id}'" title="Editar"><i class="ph ph-pencil-simple"></i></button>
                                    <button class="btn-action" onclick="window.location.href='responses.html?id=${f.id}'" title="Respostas"><i class="ph ph-list-numbers"></i></button>
                                    <button class="btn-action danger" onclick="deleteForm('${f.id}')" title="Eliminar"><i class="ph ph-trash"></i></button>
                                </td>
                            </tr>
                        `;
                    });
                    // Global Cleanup Button at the end of forms tab if not filtered
                    if (!filterUid) {
                        html += `
                            <tr>
                                <td colspan="4" style="text-align:center; padding:32px;">
                                    <button class="btn-action danger" onclick="deleteAllResponses()" style="padding:12px 24px; font-weight:700;">
                                        <i class="ph ph-skull"></i> APAGAR TODAS AS RESPOSTAS (TOTAL)
                                    </button>
                                    <p style="font-size:12px; color:#ef4444; margin-top:8px;">Aviso: Esta ação apagará todas as respostas de todos os formulários. Não apaga os formulários.</p>
                                </td>
                            </tr>
                        `;
                    }
                    html += `</tbody></table>`;
                    content.innerHTML = html;
                }
            } catch (e) {
                content.innerHTML = `<div class="loading-overlay" style="color:#ef4444;"><i class="ph ph-warning"></i> Erro ao carregar dados: ${e.message}</div>`;
            }
        }

        window.setUserStatus = async (uid, status, btn = null) => {
            const originalHtml = btn ? btn.innerHTML : '';
            if (btn) {
                btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i>...';
                btn.disabled = true;
            }

            console.log(`[Admin] Alterando status de ${uid} para ${status}...`);
            try {
                const data = { status: status };
                if (status === 'active') {
                    console.log(`[Admin] Limpando campos de moderação para reativação...`);
                    data.moderateReason = deleteField();
                    data.suspendedAt = deleteField();
                    data.suspendedUntil = deleteField();
                    data.bannedAt = deleteField();
                    data.status = 'active';
                }
                const userRef = doc(db, "users", uid);
                await updateDoc(userRef, data);
                console.log(`[Admin] Sucesso ao atualizar ${uid}`);
                loadTabData();
            } catch (e) {
                console.error("[Admin] Erro fatal ao atualizar status:", e);
                if (btn) {
                    btn.innerHTML = '<i class="ph ph-warning"></i> Erro';
                    setTimeout(() => { btn.innerHTML = originalHtml; btn.disabled = false; }, 3000);
                }
                alert("Erro ao atualizar status: " + e.message);
            } finally {
                if (btn && status !== 'active') {
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                }
            }
        };

        window.viewUserForms = (uid, email) => {
            filterUid = uid;
            filterEmail = email;
            switchTab('forms');
        };

        window.deleteForm = async (id) => {
            if (!confirm("Tem a certeza que deseja eliminar este formulário permanentemente?")) return;
            try {
                await deleteDoc(doc(db, "forms", id));
                loadTabData();
            } catch (e) { alert("Erro ao eliminar formulário: " + e.message); }
        };

        // Modal Logic
        window.openSuspendModal = (uid) => {
            targetUid = uid;
            document.getElementById('modal-suspend').classList.add('active');
        };

        window.openBanModal = (uid) => {
            targetUid = uid;
            document.getElementById('modal-ban').classList.add('active');
        };

        window.closeModals = () => {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
            targetUid = null;
        };

        document.getElementById('btn-do-suspend').onclick = async () => {
            const reason = document.getElementById('suspend-reason').value;
            const until = document.getElementById('suspend-until').value;
            if (!reason) { alert("Por favor, fornece uma razão."); return; }

            try {
                const data = {
                    status: 'suspended',
                    moderateReason: reason,
                    suspendedAt: new Date()
                };
                if (until) data.suspendedUntil = new Date(until);

                await updateDoc(doc(db, "users", targetUid), data);
                closeModals();
                loadTabData();
            } catch (e) { alert("Erro: " + e.message); }
        };

        document.getElementById('btn-do-ban').onclick = async () => {
            const reason = document.getElementById('ban-reason').value;
            if (!reason) { alert("Por favor, fornece uma razão."); return; }

            try {
                await updateDoc(doc(db, "users", targetUid), {
                    status: 'banned',
                    moderateReason: reason,
                    bannedAt: new Date()
                });
                closeModals();
                loadTabData();
            } catch (e) { alert("Erro: " + e.message); }
        };

        window.deleteAllResponses = async () => {
            const confirmMsg = "ATENÇÃO: Desejas apagar TODAS as respostas de TODOS os formulários? Esta ação é IRREVERSÍVEL.";
            if (!confirm(confirmMsg)) return;
            if (!confirm("CONFIRMAÇÃO FINAL: Apagar todas as respostas agora?")) return;

            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> A APAGAR...';
            btn.disabled = true;

            try {
                const snap = await getDocs(collection(db, "responses"));
                let count = 0;
                for (const docSnap of snap.docs) {
                    await deleteDoc(doc(db, "responses", docSnap.id));
                    count++;
                }
                alert(`Sucesso! ${count} respostas foram eliminadas.`);
                loadStats();
                loadTabData();
            } catch (e) {
                alert("Erro ao apagar respostas: " + e.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        };
    </script>
    <script type="module">
        import { applyGlobalTheme } from '/global-theme.js';
        applyGlobalTheme();
    </script>
</body>

</html>
