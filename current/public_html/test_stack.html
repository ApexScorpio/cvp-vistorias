<!DOCTYPE html>
<html>
<head>
<style>
.pill-palette-saved {
    margin-top: 0; padding-top: 0; border-top: none;
    width: 20px; /* Maybe the container is very narrow? */
}
.palette-grid {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
}
.pill-color-dot {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    border: 1px solid rgba(0, 0, 0, 0.1);
    background: blue;
}
</style>
</head>
<body>
<div class="pill-palette-saved">
    <div style="font-size: 10px; color: #94a3b8; margin-bottom: 5px;">Minhas Cores</div>
    <div class="palette-grid">
        <div class="pill-color-dot"></div>
        <div class="pill-color-dot"></div>
        <div class="pill-color-dot"></div>
        <div class="pill-color-dot"></div>
    </div>
</div>
</body>
</html>
