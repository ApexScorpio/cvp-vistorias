    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, var(--theme-hero-start, #020617) 0%, var(--theme-hero-end, #0f172a) 100%);
            background-attachment: fixed;
            color: var(--theme-text-main, #f8fafc);
            font-family: 'Outfit', sans-serif;
            margin: 0; padding: 40px 20px; min-height: 100vh;
            display: flex; justify-content: center; align-items: flex-start;
        }
        .preview-container {
            width: 100%; max-width: 800px;
            background: var(--theme-card-bg, #0b1120);
            border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 0, 0, 0.3);
            overflow: hidden; padding-bottom: 80px; margin: 0 auto;
        }
        .form-body { padding: 40px 48px 0 48px; }
        @media (max-width: 600px) { .form-body { padding: 40px 20px 0 20px !important; } }
        .cover-image-placeholder {
            width: 100%; height: 220px;
            background-color: var(--theme-hero-start, #7f1d1d);
            background-image: linear-gradient(135deg, var(--theme-hero-start, #7f1d1d) 0%, var(--theme-hero-mid, #1e293b) 60%, var(--theme-hero-end, #0f172a) 100%);
            background-size: contain !important; background-repeat: no-repeat !important; background-position: center !important;
            margin-bottom: 0; position: relative;
        }
        .block-title { font-size: 32px; font-weight: 800; margin-bottom: 24px; color: #f8fafc; line-height: 1.1; word-break: break-word; }
        .block-desc { font-size: 16px; color: #94a3b8; margin-bottom: 32px; line-height: 1.5; }
        .block-section-heading {
            font-size: 20px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.08em;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 8px; margin-bottom: 24px;
        }
        .block-divider { border: none; border-top: 1px solid rgba(255, 255, 255, 0.1); margin: 16px 0 32px; }
        .block-question { font-size: 16px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .required { color: #ef4444; font-size: 20px; font-weight: 700; }
        .pill-options-container { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
        .pill-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .pill-btn {
            background-color: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc; border-radius: 8px; padding: 4px 8px; font-size: 13px; line-height: 1.15;
            text-align: center; cursor: pointer; transition: all 0.2s; user-select: none;
            backdrop-filter: blur(4px); touch-action: manipulation; -webkit-tap-highlight-color: transparent;
            min-height: 48px; display: flex; align-items: center; justify-content: center;
        }
        .pill-btn.selected {
            border: 3px solid #ffffff !important; box-shadow: 0 0 25px rgba(59, 130, 246, 0.7) !important;
            transform: scale(1.05); z-index: 10;
        }
        .pill-other-input {
            background: transparent; border: none; border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            color: white; padding: 2px 4px; margin-left: 8px; font-size: 13px; width: 120px; outline: none; display: none;
        }
        .pill-btn.selected .pill-other-input { display: inline-block; }
        input[type="text"], input[type="date"], textarea {
            width: 100%; background-color: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; padding: 14px 18px; font-size: 15px; color: #f8fafc; font-family: inherit; transition: all 0.2s;
        }
        input:focus, textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        
        .inventory-manual-input {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--theme-card-bg, #1e293b); color: white; border: 2px solid #3b82f6;
            border-radius: 8px; text-align: center; font-size: 16px; z-index: 20; 
            outline: none; box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        @media (max-width: 600px) {
            body { padding: 0; }
            .pill-btn { width: 48% !important; flex-basis: 48% !important; }
            .preview-container { border-radius: 0; border: none; }
            .form-body { padding: 24px 20px 0 20px; }
            .block-title { font-size: 22px; }
            .cover-image-placeholder { height: 160px; }
        }

        /* Image Layout Modes */
        .block-image.layout-mode-front, .block-image.layout-mode-back {
            height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: visible !important;
        }
        .block-image.layout-mode-front { z-index: 9999; position: relative; }
        .block-image.layout-mode-back { z-index: -1; position: relative; }
        .block-image.layout-mode-flow { z-index: 9000; position: relative; }

        /* Replenishment List CSS */
        .replenishment-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;

            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);

        .replenishment-title-input {
            background: transparent;
            border: none;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.15);

            font-size: 20px;

            padding: 4px 0;

        .replenishment-title-input:focus {
            border-bottom-color: #3b82f6;
        }
        .replenishment-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);

        }
        .replenishment-item-name {
            font-weight: 600;
            font-size: 15px;
            flex: 1;
            transition: color 0.2s;
            color: #f8fafc;
        }
        .replenishment-item-name.color-yellow {
            color: #fbbf24 !important;
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.4);
        }
        .replenishment-item-name.color-red {
            color: #f43f5e !important;

        .replenishment-badge {

        .replenishment-qty-controls {
            display: flex;

        }
        .replenishment-qty-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;

            transition: all 0.2s;
        }
        .replenishment-qty-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }
        .replenishment-qty-input {
            width: 48px;
            height: 28px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;

        .replenishment-qty-input::-webkit-inner-spin-button, 
        .replenishment-qty-input::-webkit-outer-spin-button {
            -webkit-appearance: none;

        .replenishment-delete-btn {
            background: none;

            color: #f43f5e;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            display: flex;

            transition: all 0.2s;
        }
        .replenishment-delete-btn:hover {
            background: rgba(244, 63, 94, 0.1);
            transform: scale(1.1);

        .replenishment-add-form {
            display: flex;
            gap: 8px;

            border-top: 1px solid rgba(255, 255, 255, 0.08);

        .replenishment-add-input {
            background: rgba(0, 0, 0, 0.2) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 8px !important;
            padding: 8px 12px !important;
            font-size: 14px !important;

        }

            background: #3b82f6;

        }
        .replenishment-add-btn:hover {
            background: #2563eb;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }
    </style>

    <script>
        // Inline fallback theme engine
        window.applyTheme = function(themeId) {
            const themes = {
                cobalt: { primary: '#3b82f6', heroStart: '#020617', heroMid: '#1e293b', heroEnd: '#0f172a', cardBg: '#0b1120', textMain: '#f8fafc' },
                midnight: { primary: '#6366f1', heroStart: '#090d16', heroMid: '#111827', heroEnd: '#030712', cardBg: '#0f172a', textMain: '#f8fafc' },
                emerald: { primary: '#10b981', heroStart: '#022c22', heroMid: '#064e3b', heroEnd: '#0f172a', cardBg: '#06201b', textMain: '#f8fafc' },
                crimson: { primary: '#ef4444', heroStart: '#450a0a', heroMid: '#7f1d1d', heroEnd: '#0f172a', cardBg: '#1c0909', textMain: '#f8fafc' },
                amber: { primary: '#f59e0b', heroStart: '#451a03', heroMid: '#78350f', heroEnd: '#0f172a', cardBg: '#1c1106', textMain: '#f8fafc' }
            };
            const t = themes[themeId] || themes.cobalt;
            const root = document.documentElement;
            root.style.setProperty('--theme-primary', t.primary);
            root.style.setProperty('--theme-hero-start', t.heroStart);
            root.style.setProperty('--theme-hero-mid', t.heroMid);
            root.style.setProperty('--theme-hero-end', t.heroEnd);
            root.style.setProperty('--theme-card-bg', t.cardBg);
            root.style.setProperty('--theme-text-main', t.textMain);

    <script type="module">
        import { applyTheme } from '/themes.js?v=201';
        import { auth, db, onAuthStateChanged, collection, doc, setDoc, getDoc, getDocs, query, where, serverTimestamp } from '/firebase-config.js?v=201';

        import { normalize, visibleOptionRows, identityIndices, latestVehicleReport, matchingAnswers, createRecoveryController } from '/form-recovery.js?v=20260909-viatura-1';

        let currentUser = null;
        let currentFormId = null;
        let currentFormConfig = null;
        window.inventoryData = {};
        window.replenishmentTitle = "Requisição de items";
        window.replenishmentItems = []; // Itens: { id, name, missing, requested, manual, hasEditedQty }
        window.removedReplenishmentIds = new Set();

        const authReady = new Promise((resolve) => {
            onAuthStateChanged(auth, (user) => {
                currentUser = user; resolve(user);
                queueMicrotask(() => checkPreviousReport());
            });
        });

        function getContrastYIQ(hexcolor) {
            if (!hexcolor) return '#000000';
            hexcolor = hexcolor.replace("#", "");
            if (hexcolor.length === 3) hexcolor = hexcolor.split('').map(c => c + c).join('');
            const r = parseInt(hexcolor.substr(0, 2), 16), g = parseInt(hexcolor.substr(2, 2), 16), b = parseInt(hexcolor.substr(4, 2), 16);
            const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            return (yiq >= 128) ? '#1e293b' : '#ffffff';
        }

        window.togglePill = (btn, isMulti) => {
            const blockEl = btn.closest('.block'), wasSelected = btn.classList.contains('selected');
            if (!isMulti) {
                blockEl.querySelectorAll('.pill-btn').forEach(p => { p.classList.remove('selected'); const otherInp = p.querySelector('.pill-other-input'); if (otherInp) otherInp.value = ''; });
                if (!wasSelected) btn.classList.add('selected');
            } else { btn.classList.toggle('selected'); }
            checkPreviousReport();
            if (btn.classList.contains('pill-other') && btn.classList.contains('selected')) {
                const inp = btn.querySelector('.pill-other-input'); if (inp) setTimeout(() => inp.focus(), 150);
            }
        };


        function readBlockAnswer(index) {
            const input = document.getElementById(`ans-${index}`);
            if (input) return input.value.trim();
            const selected = [...document.querySelectorAll(`#block-${index} .pill-btn.selected`)];
            if (selected.length !== 1) return '';
            return selected[0].classList.contains('pill-other')
                ? `Outra: ${selected[0].querySelector('input')?.value.trim() || ''}`
                : selected[0].textContent.trim();
        }

        function recoveryContext() {
            if (!currentUser || currentUser.isAnonymous || !currentFormId || window.isPreviewMode) return null;
            const schema = window.currentSchema || [], indices = identityIndices(schema);
            if (indices.driver < 0 || indices.vehicle < 0) return null;
            const driver = readBlockAnswer(indices.driver), vehicle = readBlockAnswer(indices.vehicle);
            if (!normalize(driver).includes('miguel') || !vehicle) return null;
            return { uid: currentUser.uid, formId: currentFormId, driver, vehicle,
                vehicleQuestion: schema[indices.vehicle].question,
                driverIndex: indices.driver, vehicleIndex: indices.vehicle,
                };
        }

        function restorePreviousAnswers(report, context) {
            const schema = window.currentSchema || [];
            matchingAnswers(schema, report.answers).forEach(({ block, index, answer }) => {
                // Preserve the current identity which authorized and selected this lookup.
                if (index === context.driverIndex || index === context.vehicleIndex) return;
                const element = document.getElementById(`block-${index}`);
                if (!element) return;
                if (['text-short', 'text-long', 'date'].includes(block.type)) {
                    const input = document.getElementById(`ans-${index}`);
                    if (input && (answer == null || typeof answer === 'string' || typeof answer === 'number')) {
                        input.value = answer == null ? '' : String(answer);
                    }
                } else if (['choice-single', 'choice-multi'].includes(block.type)) {
                    const values = (Array.isArray(answer) ? answer : [answer]).filter(v => typeof v === 'string');
                    const pills = [...element.querySelectorAll('.pill-btn')];
                    pills.forEach(pill => {
                        pill.classList.remove('selected');
                        const input = pill.querySelector('.pill-other-input');
                        if (input) input.value = '';
                    });
                    for (const value of values) {
                        let pill = pills.find(p => !p.classList.contains('pill-other') && p.textContent.trim() === value);
                        // Do not turn a disabled/deleted option into "Outra".
                        if (!pill && (value === 'Outra' || value.startsWith('Outra: '))) {
                            pill = pills.find(p => p.classList.contains('pill-other'));
                            if (pill) pill.querySelector('input').value = value === 'Outra' ? '' : value.slice(7);
                        }
                        if (pill) {
                            pill.classList.add('selected');
                            if (block.type === 'choice-single') break;
                        }
                    }
                } else if (block.type === 'inventory' && Array.isArray(answer)) {
                    let rows = block.inventoryItems || [];
                    const flatItems = rows.length > 0 && !Array.isArray(rows[0]);
                    if (flatItems) rows = [rows];
                    const items = rows.flat();
                    rows.forEach((row, r) => row.forEach((item, c) => {
                        const matches = answer.filter(a => a && a.name === item.name);
                        if (matches.length === 1 && items.filter(i => i.name === item.name).length === 1 &&
                            typeof matches[0].count === 'number' && Number.isFinite(matches[0].count)) {
                            window.updateInventoryCount(index, flatItems ? c : r, flatItems ? undefined : c, 0, matches[0].count);
                        }
                    }));
                }
            });
        }

        const checkPreviousReport = createRecoveryController({
            getContext: recoveryContext,
            findLatest: async context => {
                // Equality-only query: no composite index or global 100-document cutoff.
                const snapshot = await getDocs(query(collection(db, 'responses'), where('formId', '==', context.formId)));
                return latestVehicleReport(snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id })), context);
            },
            confirmLoad: (_report, context) => window.confirm(`Carregar as respostas do último relatório da viatura ${context.vehicle}?\nAs respostas correspondentes serão substituídas. O formulário não será submetido.`),
            apply: restorePreviousAnswers,
            notify: message => {
                const status = document.getElementById('previous-report-status');
                if (status) status.textContent = message;
            }
        });

        let wasLongPress = false;
        window.updateInventoryCount = (blockIdx, rowIdx, colIdx, delta, exactValue = null) => {
            // If it's a regular increment click but we just reset with long-press, skip.
            if (wasLongPress && delta === 1) { wasLongPress = false; return; }
            wasLongPress = false;

            const block = window.currentSchema[blockIdx];
            const itemId = (colIdx === undefined) ? `inv-${blockIdx}-${rowIdx}` : `inv-${blockIdx}-${rowIdx}-${colIdx}`;
            const item = (colIdx === undefined) ? block.inventoryItems[rowIdx] : block.inventoryItems[rowIdx][colIdx];
            
            const current = (itemId in window.inventoryData) ? Number(window.inventoryData[itemId]) : undefined;
            let newVal;
            if (exactValue !== null) {
                newVal = Math.max(0, parseInt(exactValue) || 0);
            } else {
                newVal = (current === undefined) ? Math.max(0, delta) : Math.max(0, current + delta);
            }
            window.inventoryData[itemId] = newVal;

            const countEl = document.getElementById(`count-${itemId}`), cardEl = document.getElementById(`card-${itemId}`);
            if (countEl) countEl.textContent = newVal;
            if (cardEl) {
                const target = Number(item.required) || 0;
                cardEl.classList.remove('is-below', 'is-equal', 'is-above');
                if (newVal < target) cardEl.classList.add('is-below');
                else if (newVal === target) cardEl.classList.add('is-equal');
                else cardEl.classList.add('is-above');
                
                if (exactValue === null) {
                    cardEl.style.transform = 'scale(0.95)';
                    setTimeout(() => cardEl.style.transform = '', 100);
                }
            }

            if (window.removedReplenishmentIds) {
                window.removedReplenishmentIds.delete(itemId);
            }
            if (typeof window.updateReplenishmentFromInventory === 'function') {
                window.updateReplenishmentFromInventory();
            }
        };

        window.handleInventoryContextMenu = (e, bIdx, rIdx, cIdx) => {
            e.preventDefault();
            window.updateInventoryCount(bIdx, rIdx, cIdx, -1);
        };

        let touchStartX = 0, longPressTimer = null;
        const getEventX = (e) => e.touches ? e.touches[0].clientX : e.clientX;

        window.handlePressStart = (e, bIdx, rIdx, cIdx) => {
            touchStartX = getEventX(e);
            e.currentTarget.style.transition = 'none';
            clearTimeout(longPressTimer);
            longPressTimer = setTimeout(() => {
                window.updateInventoryCount(bIdx, rIdx, cIdx, 0, 0); // Reset to 0
                if (window.navigator.vibrate) window.navigator.vibrate(50);
                wasLongPress = true; longPressTimer = null;
            }, 800);
        };

        window.handlePressMove = (e) => {
            const dx = touchStartX - getEventX(e);
            if (Math.abs(dx) > 10) clearTimeout(longPressTimer);
            if (dx > 0) e.currentTarget.style.transform = `translateX(-${Math.min(dx, 80)}px)`;
        };

        window.handlePressEnd = (e, bIdx, rIdx, cIdx) => {
            clearTimeout(longPressTimer);
            const finalX = (e.changedTouches ? e.changedTouches[0].clientX : e.clientX);
            const dx = touchStartX - finalX;
            e.currentTarget.style.transition = 'transform 0.3s ease'; e.currentTarget.style.transform = '';
            if (dx > 60) {
                window.updateInventoryCount(bIdx, rIdx, cIdx, -1);
                wasLongPress = true; // prevent click if it was a swipe
            }
        };

        window.switchInventoryToInput = (e, bIdx, rIdx, cIdx) => {
            e.stopPropagation();
            const itemId = (cIdx === undefined) ? `inv-${bIdx}-${rIdx}` : `inv-${bIdx}-${rIdx}-${cIdx}`;
            const countEl = document.getElementById(`count-${itemId}`);
            if (!countEl) return;

            const input = document.createElement('input');
            input.type = 'number'; input.className = 'inventory-manual-input';
            input.value = window.inventoryData[itemId] || 0;
            input.onblur = () => {
                window.updateInventoryCount(bIdx, rIdx, cIdx, 0, parseInt(input.value) || 0);
                const span = document.createElement('div'); span.className = 'inventory-count-pill'; span.id = `count-${itemId}`;
                span.textContent = window.inventoryData[itemId];
                span.onclick = (ev) => window.switchInventoryToInput(ev, bIdx, rIdx, cIdx);
                input.parentNode.replaceChild(span, input);
            };
            input.onkeydown = (ev) => { if (ev.key === 'Enter') input.blur(); };
            countEl.parentNode.replaceChild(input, countEl);
            input.focus(); input.select();
        };

        window.updateReplenishmentFromInventory = () => {
            const schema = window.currentSchema || [];
            schema.forEach((block, idx) => {
                if (block.type !== 'inventory') return;
                let rows = block.inventoryItems || [];
                if (rows.length > 0 && !Array.isArray(rows[0])) rows = [rows];

                rows.forEach((row, rIdx) => {
                    row.forEach((item, cIdx) => {
                        const itemId = `inv-${idx}-${rIdx}-${cIdx}`;
                        const countVal = window.inventoryData[itemId];
                        const count = (countVal !== undefined) ? Number(countVal) : 0;
                        const target = item.required || 0;

                        const missing = target - count;

                        if (count < target) {
                            if (window.removedReplenishmentIds.has(itemId)) return;

                            const existing = window.replenishmentItems.find(i => i.id === itemId);
                            if (existing) {
                                existing.missing = missing;
                                if (!existing.hasEditedQty) {
                                    existing.requested = missing;
                                }
                            } else {
                                window.replenishmentItems.push({
                                    id: itemId,
                                    name: item.name,
                                    missing: missing,
                                    requested: missing,
                                    manual: false,
                                    hasEditedQty: false
                                });
                            }
                        } else {
                            const existingIdx = window.replenishmentItems.findIndex(i => i.id === itemId);
                            if (existingIdx !== -1) {
                                window.replenishmentItems.splice(existingIdx, 1);
                            }
                        }
                    });
                });
            });
            window.renderReplenishmentList();
        };

        window.renderReplenishmentList = () => {
            const repContainer = document.getElementById('replenishment-list-container');
            if (!repContainer) return;

            let html = `
                <div class="replenishment-container">
                    <input type="text" class="replenishment-title-input" value="${window.replenishmentTitle}" oninput="window.replenishmentTitle = this.value" placeholder="Título da lista...">
                    <div class="replenishment-list">
            `;

            if (window.replenishmentItems.length === 0) {
                html += `<div style="text-align: center; color: #94a3b8; padding: 20px 0; font-size: 14px;"><i class="ph ph-info" style="font-size: 20px; vertical-align: middle; margin-right: 6px;"></i>Nenhum item necessita de reposição no momento.</div>`;
            } else {
                window.replenishmentItems.forEach((item, idx) => {
                    let colorClass = '';
                    if (item.requested > item.missing) colorClass = 'color-yellow';
                    else if (item.requested < item.missing) colorClass = 'color-red';

                    const missingLabel = item.manual ? 'Adicionado manual' : `Falta: ${item.missing}`;

                    html += `
                        <div class="replenishment-row">
                            <div class="replenishment-item-name ${colorClass}">${item.name}</div>
                            <div class="replenishment-badge">${missingLabel}</div>
                            <div class="replenishment-qty-controls">
                                <button type="button" class="replenishment-qty-btn" onclick="window.changeReplenishmentQty(${idx}, -1)">−</button>
                                <input type="number" class="replenishment-qty-input" value="${item.requested}" min="0" onchange="window.setReplenishmentQty(${idx}, this.value)">
                                <button type="button" class="replenishment-qty-btn" onclick="window.changeReplenishmentQty(${idx}, 1)">+</button>
                            </div>
                            <button type="button" class="replenishment-delete-btn" onclick="window.deleteReplenishmentItem(${idx})" title="Remover item">
                                <i class="ph ph-trash"></i>
                            </button>
                        </div>
                    `;
                });
            }

            html += `
                    </div>
                    <div class="replenishment-add-form">
                        <input type="text" id="manual-item-name" class="replenishment-add-input" style="flex: 1;" placeholder="Nome do artigo a adicionar...">
                        <input type="number" id="manual-item-qty" class="replenishment-add-input" style="width: 70px; text-align: center;" value="1" min="1">
                        <button type="button" class="replenishment-add-btn" onclick="window.addManualReplenishmentItem()">
                            <i class="ph ph-plus"></i> Adicionar
                        </button>
                    </div>
                </div>
            `;

            repContainer.innerHTML = html;
        };

        window.changeReplenishmentQty = (idx, delta) => {
            const item = window.replenishmentItems[idx];
            item.requested = Math.max(0, item.requested + delta);
            item.hasEditedQty = true;
            window.renderReplenishmentList();
        };

        window.setReplenishmentQty = (idx, val) => {
            const item = window.replenishmentItems[idx];
            item.requested = Math.max(0, parseInt(val) || 0);
            item.hasEditedQty = true;
            window.renderReplenishmentList();
        };

        window.deleteReplenishmentItem = (idx) => {
            const item = window.replenishmentItems[idx];
            if (!item.manual) {
                window.removedReplenishmentIds.add(item.id);
            }
            window.replenishmentItems.splice(idx, 1);
            window.renderReplenishmentList();
        };

        window.addManualReplenishmentItem = () => {
            const nameInp = document.getElementById('manual-item-name');
            const qtyInp = document.getElementById('manual-item-qty');
            if (!nameInp || !qtyInp) return;

            const name = nameInp.value.trim();
            const qty = Math.max(1, parseInt(qtyInp.value) || 1);

            if (!name) return;

            window.replenishmentItems.push({
                id: 'manual-' + Date.now(),
                name: name,
                missing: qty,
                requested: qty,
                manual: true,
                hasEditedQty: false
            });
            window.renderReplenishmentList();

            nameInp.value = '';
            qtyInp.value = '1';
            nameInp.focus();
        };

        async function loadForm() {
            const container = document.getElementById('preview-container'), urlParams = new URLSearchParams(window.location.search);
            const isPreviewMode = urlParams.get('preview') === 'true';
            let formId = urlParams.get('id');
            window.isPreviewMode = isPreviewMode;

            if (isPreviewMode) {
                document.getElementById('preview-banner').style.display = 'block';
                const localSchema = localStorage.getItem('lp_preview_schema');
                if (localSchema) {
                    try { window.currentSchema = JSON.parse(localSchema); applyTheme('midnight'); renderForm(window.currentSchema); return; } catch(e) {}
                }
                if (formId === 'local-draft') { container.innerHTML = "<div style='padding:50px; text-align:center;'><h2>Aguardando dados...</h2></div>"; return; }
            }

            await authReady;
            let formSnap = null;

            if (formId) {
                formSnap = await getDoc(doc(db, "forms", formId));
            } else {
                const path = window.location.pathname;
                let slug = "";
                if (path.includes('/f/')) {
                    slug = path.substring(path.indexOf('/f/') + 3);
                } else if (path.startsWith('/f')) {
                    slug = path.substring(2);
                }
                
                if (slug.endsWith('/')) {
                    slug = slug.substring(0, slug.length - 1);
                }
                
                if (!slug) {
                    slug = urlParams.get('slug');
                }

                if (slug) {
                    const q = query(collection(db, "forms"), where("slug", "==", slug));
                    const querySnapshot = await getDocs(q);
                    if (!querySnapshot.empty) {
                        formSnap = querySnapshot.docs[0];
                        formId = formSnap.id;
                    }
                }
            }

            if (formSnap && formSnap.exists()) {
                currentFormId = formId; currentFormConfig = formSnap.data();
                if (currentFormConfig.isInventory === true) {
                    const qParam = isPreviewMode ? '&preview=true' : '';
                    window.location.replace(`/inventory_view.html?id=${formId}${qParam}`);
                    return;
                }
                if (currentFormConfig.theme) {
                    if (typeof currentFormConfig.theme === 'string') applyTheme(currentFormConfig.theme);
                    else { applyTheme(currentFormConfig.theme.id || 'cobalt'); if (currentFormConfig.theme.color) document.documentElement.style.setProperty('--theme-primary', currentFormConfig.theme.color); }
                } else applyTheme('cobalt');
                window.currentSchema = currentFormConfig.schema || [];
                window.currentSchema.forEach(b => { if (typeof b.options === 'string') { try { b.options = JSON.parse(b.options); } catch(e) { b.options = []; } } });
                renderForm(window.currentSchema);
                if (currentFormConfig.theme?.coverImage) { const cp = document.querySelector('.cover-image-placeholder'); if (cp) cp.style.backgroundImage = `url('${currentFormConfig.theme.coverImage}')`; }
            } else {
                container.innerHTML = `
                    <div style="padding: 40px; text-align: center; color: #94a3b8;">
                        <i class="ph ph-warning" style="font-size: 48px; color: #ef4444; margin-bottom: 16px;"></i>
                        <h2>Formulário não encontrado</h2>
                        <p>Verifique o endereço e tente novamente.</p>
                    </div>
                `;
            }
        }

        function renderForm(schema) {
            // Auto-heal broken reference map images
            schema.forEach(block => {
                if (block.type === 'image' && block.url === 'https://i.imgur.com/vHq0M5z.png') {
                    block.url = '/assets/mala_trauma_mapa.jpg';
                }
            });

            const container = document.getElementById('preview-container');
            let html = `<div class="cover-image-placeholder"></div><div class="form-body">`;
            schema.forEach((block, index) => {
                const layoutMode = block.layoutMode || 'flow';
                html += `<div class="block block-${block.type} layout-mode-${layoutMode}" id="block-${index}" style="margin-bottom: 32px;">`;
                if (block.type === 'title') {
                    html += `<h1 class="block-title">${block.content || 'Sem título'}</h1>`;
                    if (index === 0) document.title = (new DOMParser().parseFromString(block.content, 'text/html')).body.textContent || 'Formulário';
                    if (block.hasDescription) html += `<div class="block-desc">${block.description || ''}</div>`;
                } else if (block.type === 'section') {
                    html += `<div class="block-section-heading">${block.question || 'Secção'}</div>`;
                } else if (block.type === 'divider') {
                    html += `<hr class="block-divider">`;
                } else if (block.type === 'image') {
                    const width = block.width || 100;
                    const offsetX = block.offsetX || 0;
                    const offsetY = block.offsetY || 0;
                    const layoutMode = block.layoutMode || 'flow';
                    
                    // In overlay modes, we want the margin to be zero so it doesn't push stuff
                    const outerMargin = (layoutMode === 'flow') ? '24px 0' : '0';
                    
                    html += `
                        <div style="margin:${outerMargin}; display:flex; justify-content:flex-start;">
                            <div style="width:${width}%; margin-left:${offsetX}%; transform:translateY(${offsetY}px); transition:none;">
                                <img src="${block.url}" style="width:100%; border-radius:12px; box-shadow:0 12px 30px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);">
                            </div>
                        </div>`;
                } else {
                    const isInv = block.type === 'inventory';
                    html += `<div class="block-question ${isInv?'inventory-category-header':''}">${block.question || ''}${block.required?'<span class="required" style="margin-left:4px">*</span>':''}</div>`;
                    if (block.hasDescription) html += `<div class="block-desc" style="font-size:14px; margin-top:-8px; margin-bottom:16px;">${block.description || ''}</div>`;
                    if (block.type === 'text-short') html += `<input type="text" id="ans-${index}" placeholder="${block.placeholder||'Resposta...'}">`;
                    else if (block.type === 'text-long') html += `<textarea rows="4" id="ans-${index}" placeholder="${block.placeholder||'Resposta...'}"></textarea>`;
                    else if (block.type === 'date') html += `<input type="date" id="ans-${index}" value="${new Date().toISOString().split('T')[0]}">`;
                    else if (block.type === 'choice-single' || block.type === 'choice-multi') {
                        html += `<div class="pill-options-container">`;
                        visibleOptionRows(block.options).forEach(row => {
                            html += `<div class="pill-row">`;
                            row.forEach(opt => {
                                const text = typeof opt === 'string' ? opt : opt.text, color = typeof opt === 'object' ? opt.color : (block.pillColor || null);
                                let style = ''; if (color) { const tc = getContrastYIQ(color); style = `background-color:${color}; color:${tc}; border-color:rgba(0,0,0,0.1);`; }
                                const w = (typeof opt === 'object' && opt.width) ? opt.width : 165;
                                html += `<div class="pill-btn" style="${style} width:${w}px;" onclick="window.togglePill(this, ${block.type==='choice-multi'})">${text}</div>`;
                            });
                            html += `</div>`;
                        });

                        if (block.hasOther) {
                            const otherLabel = block.otherText || 'Outra';
                            html += `
                                <div class="pill-row">
                                    <div class="pill-btn pill-other" style="width: auto; min-width: 140px; padding: 6px 14px; display: inline-flex; align-items: center;" onclick="window.togglePill(this, ${block.type==='choice-multi'})">
                                        <span>${otherLabel}</span>
                                        <input type="text" class="pill-other-input" placeholder="Especificar..." onclick="event.stopPropagation()">
                                    </div>
                                </div>
                            `;
                        }

                        html += `</div>`;
                    } else if (block.type === 'inventory') {
                        let rows = block.inventoryItems || []; if (rows.length > 0 && !Array.isArray(rows[0])) rows = [rows];
                        html += '<div class="inventory-container">';
                        rows.forEach((row, rIdx) => {
                            html += '<div class="inventory-row" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px;">';
                            row.forEach((item, cIdx) => {
                                const id = `inv-${index}-${rIdx}-${cIdx}`, countVal = window.inventoryData[id], hasV = (countVal !== undefined), count = hasV ? Number(countVal) : 0, target = item.required || 0;
                                let statusClass = '';
                                if (hasV) {
                                    if (count < target) statusClass = 'is-below';
                                    else if (count === target) statusClass = 'is-equal';
                                    else statusClass = 'is-above';
                                }
                                html += `<div class="inventory-card ${statusClass}" id="card-${id}" 
                                            onclick="window.updateInventoryCount(${index}, ${rIdx}, ${cIdx}, 1)" 
                                            oncontextmenu="window.handleInventoryContextMenu(event, ${index}, ${rIdx}, ${cIdx})" 
                                            onmousedown="window.handlePressStart(event, ${index}, ${rIdx}, ${cIdx})"
                                            onmousemove="window.handlePressMove(event)"
                                            onmouseup="window.handlePressEnd(event, ${index}, ${rIdx}, ${cIdx})"
                                            ontouchstart="window.handlePressStart(event, ${index}, ${rIdx}, ${cIdx})" 
                                            ontouchmove="window.handlePressMove(event)" 
                                            ontouchend="window.handlePressEnd(event, ${index}, ${rIdx}, ${cIdx})">
                                            <div class="inventory-item-name">${item.name}</div>
                                            <div class="inventory-required-badge">Qt: ${target}</div>
                                            <div class="inventory-count-pill" id="count-${id}" onclick="window.switchInventoryToInput(event, ${index}, ${rIdx}, ${cIdx})">${hasV?count:''}</div>
                                         </div>`;
                            });
                            html += '</div>';
                        });
                        html += '</div>';
                    }
                }
                html += `</div>`;
            });
            const btnText = window.isPreviewMode ? "MODO PREVIEW — Submissão desativada" : "Submeter Formulário", btnState = window.isPreviewMode ? "disabled" : "";
            const hasInventory = schema.some(b => b.type === 'inventory');
            if (hasInventory) {
                html += `</div><div id="replenishment-list-container" style="padding: 0 40px;"></div>`;
            } else {
                html += `</div>`;
            }
            html += `<div style="padding: 0 40px; margin-bottom: 80px;"><button id="submit-btn" ${btnState} onclick="window.submitResponse()" style="padding:16px; border-radius:12px; background:#3b82f6; color:white; border:none; font-size:16px; font-weight:700; cursor:pointer; width:100%; transition:all 0.2s;">${btnText}</button></div>`;
            container.innerHTML = html;
            const recoveryStatus = document.createElement('p');
            recoveryStatus.id = 'previous-report-status';
            recoveryStatus.setAttribute('role', 'status');
            recoveryStatus.style.cssText = 'padding:0 40px;color:#94a3b8;';
            container.prepend(recoveryStatus);
            container.oninput = () => checkPreviousReport();
            container.onchange = () => checkPreviousReport();
            checkPreviousReport();

            window.replenishmentItems = [];
            if (hasInventory && typeof window.updateReplenishmentFromInventory === 'function') {
                window.updateReplenishmentFromInventory();
            }
        }

        async function sendNotificationEmail(answers) {
            try {
                const cfg = currentFormConfig || {};
                if (!cfg.emailNotifications) return;
                const recipients = cfg.notificationEmails || [];
                if (!recipients.length) return;

                if (!BREVO_API_KEY || BREVO_API_KEY.includes('API_KEY')) {
                    console.warn('[Email] Brevo API Key não configurada.');
                    return;
                }

                const formName = cfg.name || cfg.title || document.title || 'Formulário';
                const respondent = currentUser?.email || 'Anónimo';
                const submittedAt = new Date().toLocaleString('pt-PT', { timeZone: 'Europe/Lisbon' });

                // Map answers by question label for quick lookup
                const answerMap = {};
                answers.forEach(a => {
                    const key = (a.question || '').toLowerCase().trim();
                    answerMap[key] = a.answer;
                });

                // Helper to get high-contrast text color (black or white)
                const getContrastYIQ = (hexcolor) => {
                    if (!hexcolor) return '#000000';
                    let hex = hexcolor.replace("#", "");
                    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
                    const r = parseInt(hex.substr(0, 2), 16);
                    const g = parseInt(hex.substr(2, 2), 16);
                    const b = parseInt(hex.substr(4, 2), 16);
                    const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
                    return (yiq >= 128) ? '#1e293b' : '#ffffff';
                };

                // Helper to check if an option is selected
                const isSelected = (answer, optVal) => {
                    if (answer === undefined || answer === null) return false;
                    const val = String(optVal || '').toLowerCase().trim();
                    if (Array.isArray(answer)) return answer.some(v => String(v || '').toLowerCase().trim() === val);
                    return String(answer || '').toLowerCase().trim() === val;
                };

                // --- SECTION 1: Text Summary ---
                let answersHtml = '';
                answers.forEach(a => {
                    let valText = a.answer;
                    if (Array.isArray(valText)) {
                        valText = valText.map(x => typeof x === 'object' ? `${x.name}: ${x.count}` : x).join(', ');
                    } else if (typeof valText === 'object' && valText !== null) {
                        valText = (valText.items || []).map(item => `<span style="display:inline-block;background:#fee2e2;color:#ef4444;padding:2px 8px;border-radius:4px;margin:2px;font-size:12px;font-weight:600;">${item.name} (${item.requested})</span>`).join(' ') || '<span style="color:#10b981;font-weight:600;">Sem items em falta</span>';
                    } else {
                        valText = String(valText || '');
                    }
                    answersHtml += `
                        <div style="margin-bottom:16px;">
                            <p style="margin:0 0 4px 0; font-size:12px; font-weight:bold; color:#64748b; text-transform:uppercase;">${a.question}</p>
                            <div style="font-size:14px; color:#1e293b; background:#f1f5f9; padding:10px 14px; border-radius:8px;">
                                ${valText || '<i style="color:#94a3b8;">Sem resposta</i>'}
                            </div>
                        </div>`;
                });

                // --- SECTION 2: Visual Representation ---
                const schema = window.currentSchema || cfg.schema || [];
                let visualHtml = '';
                let hasInventory = false;

                schema.forEach(block => {
                    const bType = (block.type || '').toLowerCase();
                    const isPillBlock = ['choice-single', 'choice-multi', 'dropdown', 'pills', 'multiple'].includes(bType);
                    const isTextBlock = ['text-short', 'text-long', 'date'].includes(bType);
                    const isInv = bType === 'inventory';

                    if (!isPillBlock && !isTextBlock && !isInv) return;
                    if (isInv) hasInventory = true;

                    const label = block.question || block.label || block.title || block.content || 'Questão';
                    const answer = answerMap[(label || '').toLowerCase().trim()];

                    visualHtml += `
                        <div style="margin-bottom:24px;">
                            <p style="margin:0 0 10px 0; font-size:14px; font-weight:bold; color:#1e293b;">${label}</p>`;

                    if (isPillBlock) {
                        let rawOpts = block.options || [];
                        if (typeof rawOpts === 'string') { try { rawOpts = JSON.parse(rawOpts); } catch (e) { rawOpts = []; } }

                        rawOpts.forEach(row => {
                            visualHtml += `<div style="font-size:0; margin-bottom:6px;">`;
                            const rowItems = Array.isArray(row) ? row : [row];

                            rowItems.forEach(opt => {
                                const optText = typeof opt === 'object' ? (opt.text || opt.label || opt.value || '') : opt;
                                if (!optText) return;

                                const optBg = typeof opt === 'object' ? (opt.color || opt.backgroundColor || null) : null;
                                const activeColor = optBg || (block.hasColorCode ? block.pillColor : null);
                                const selected = isSelected(answer, optText);
                                const width = (typeof opt === 'object' && opt.width) ? opt.width : 160;

                                let pillStyle = `display:inline-block; margin:0 6px 6px 0; padding:8px 4px; border-radius:10px; font-size:12px; text-align:center; width:${width}px; border:1px solid `;

                                if (selected) {
                                    const bg = activeColor || '#3b82f6';
                                    const textColor = getContrastYIQ(bg);
                                    pillStyle += `${bg}; background:${bg}; color:${textColor}; font-weight:bold;`;
                                } else {
                                    pillStyle += `#e2e8f0; background:#f8fafc; color:#94a3b8; opacity:0.6;`;
                                }
                                visualHtml += `<span style="${pillStyle}">${optText}</span>`;
                            });
                            visualHtml += `</div>`;
                        });

                        // Check for "Other" answer
                        const allPredefined = [];
                        rawOpts.forEach(r => (Array.isArray(r) ? r : [r]).forEach(o => allPredefined.push(String(typeof o === 'object' ? (o.text || o.label || o.value) : o).toLowerCase().trim())));

                        const userVals = Array.isArray(answer) ? answer : [answer];
                        userVals.forEach(uv => {
                            if (uv && !allPredefined.includes(String(uv).toLowerCase().trim())) {
                                const bg = (block.hasColorCode && block.pillColor) ? block.pillColor : '#3b82f6';
                                const tColor = getContrastYIQ(bg);
                                visualHtml += `<div style="margin-bottom:6px;"><span style="display:inline-block; padding:8px 14px; border-radius:10px; font-size:12px; font-weight:bold; background:${bg}; color:${tColor}; border:1px solid ${bg};">${uv}</span></div>`;
                            }
                        });

                    } else if (isInv) {
                        let rows = block.inventoryItems || [];
                        if (rows.length > 0 && !Array.isArray(rows[0])) rows = [rows];

                        visualHtml += `<div style="margin-top:10px; border:1px solid #e2e8f0; border-radius:12px; background:#ffffff; overflow:hidden; padding:12px;">`;
                        rows.forEach(row => {
                            visualHtml += `<div style="margin-bottom:8px; font-size:0;">`;
                            row.forEach(item => {
                                const itemName = item.name || '';
                                const target = Number(item.required) || 0;
                                let count = 0;
                                if (Array.isArray(answer)) {
                                    const ansItem = answer.find(ai => ai.name === itemName);
                                    if (ansItem) count = Number(ansItem.count) || 0;
                                }

                                let cardBg = '#f8fafc';
                                let cardBorder = '#e2e8f0';
                                let textColor = '#64748b';
                                let valColor = '#3b82f6';

                                if (count < target) {
                                    cardBg = '#fef2f2';
                                    cardBorder = '#fca5a5';
                                    textColor = '#ef4444';
                                    valColor = '#dc2626';
                                } else if (count === target) {
                                    cardBg = '#ecfdf5';
                                    cardBorder = '#6ee7b7';
                                    textColor = '#10b981';
                                    valColor = '#059669';
                                } else {
                                    cardBg = '#fffbeb';
                                    cardBorder = '#fde047';
                                    textColor = '#d97706';
                                    valColor = '#b45309';
                                }

                                visualHtml += `
                                    <div style="display:inline-block; margin:0 6px 6px 0; width:160px; padding:10px; border-radius:10px; border:1px solid ${cardBorder}; background:${cardBg}; vertical-align:top; font-family:sans-serif; text-align:left;">
                                        <div style="font-size:12px; font-weight:bold; color:#1e293b; white-space:normal; word-wrap:break-word; min-height:32px; margin-bottom:8px;">${itemName}</div>
                                        <div style="display:table; width:100%;">
                                            <div style="display:table-cell; vertical-align:bottom;">
                                                <span style="font-size:9px; color:#94a3b8; display:block; text-transform:uppercase;">QTD</span>
                                                <span style="font-size:20px; font-weight:bold; color:${valColor};">${count}</span>
                                            </div>
                                            <div style="display:table-cell; vertical-align:bottom; text-align:right;">
                                                <span style="font-size:9px; color:#94a3b8; display:block; text-transform:uppercase;">ALVO</span>
                                                <span style="font-size:14px; font-weight:bold; color:#64748b;">${target}</span>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            });
                            visualHtml += `</div>`;
                        });
                        visualHtml += `</div>`;

                    } else {
                        const valText = Array.isArray(answer) ? answer.join(', ') : (answer || '');
                        visualHtml += `
                            <div style="background:#ffffff; border:1px solid #e2e8f0; padding:10px 14px; border-radius:8px; color:#1e293b; font-size:14px; border-left:4px solid #3b82f6;">
                                ${valText || '<i style="color:#94a3b8;">Sem resposta</i>'}
                            </div>`;
                    }
                    visualHtml += `</div>`;
                });

                // Append replenishment list if inventory form
                if (hasInventory) {
                    const replenishmentAns = answers.find(a => a.question === (window.replenishmentTitle || "Requisição de items"));
                    if (replenishmentAns && replenishmentAns.answer) {
                        const repVal = replenishmentAns.answer;
                        visualHtml += `
                            <div style="margin-top:24px; margin-bottom:24px;">
                                <p style="margin:0 0 10px 0; font-size:14px; font-weight:bold; color:#1e293b;">${repVal.title || "Requisição de items"}</p>
                                <div style="background:#ffffff; border:1px solid #e2e8f0; padding:16px; border-radius:12px; border-left:4px solid #ef4444;">`;
                        
                        const repItems = repVal.items || [];
                        if (repItems.length === 0) {
                            visualHtml += `<p style="margin:0; font-size:14px; color:#10b981; font-weight:bold;">✅ Sem items em falta. Tudo conforme o alvo!</p>`;
                        } else {
                            visualHtml += `<table style="width:100%; border-collapse:collapse; font-size:13px; font-family:sans-serif;">
                                <thead>
                                    <tr style="border-bottom:1px solid #e2e8f0; text-align:left; color:#64748b;">
                                        <th style="padding:6px 0; font-weight:600;">Item</th>
                                        <th style="padding:6px 0; font-weight:600; text-align:center; width:80px;">Faltam</th>
                                        <th style="padding:6px 0; font-weight:600; text-align:right; width:80px;">Pedidos</th>
                                    </tr>
                                </thead>
                                <tbody>`;
                            
                            repItems.forEach(item => {
                                visualHtml += `
                                    <tr style="border-bottom:1px solid #f1f5f9;">
                                        <td style="padding:8px 0; color:#1e293b; font-weight:500;">${item.name}</td>
                                        <td style="padding:8px 0; color:#ef4444; font-weight:bold; text-align:center;">${item.missing}</td>
                                        <td style="padding:8px 0; color:#3b82f6; font-weight:bold; text-align:right;">${item.requested}</td>
                                    </tr>
                                `;
                            });

                            visualHtml += `</tbody></table>`;
                        }
                        visualHtml += `</div></div>`;
                    }
                }

                // Build full email HTML
                const htmlContent = `
                    <div style="font-family:Arial,sans-serif; max-width:620px; margin:0 auto; padding:20px; background:#f8fafc; border:1px solid #e2e8f0; border-top:4px solid #ef4444;">
                        
                        <!-- Branding Header -->
                        <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom:24px;">
                            <tr>
                                <td width="60" valign="top">
                                    <img src="https://i.imgur.com/haHOFbD.png" width="50" style="display:block; border:0;">
                                </td>
                                <td valign="top" style="padding-top:4px;">
                                    <div style="font-size:14px; font-weight:bold; color:#1e293b; text-transform:uppercase; letter-spacing:0.5px;">Cruz Vermelha Portuguesa</div>
                                    <div style="font-size:12px; color:#64748b;">Delegação de Portimão</div>
                                </td>
                            </tr>
                        </table>

                        <div style="background:#1e293b; padding:24px; border-radius:12px 12px 0 0;">
                            <h2 style="color:#ffffff; margin:0; font-size:20px;">🚑 Nova Resposta Submetida</h2>
                            <p style="color:#94a3b8; margin:6px 0 0 0; font-size:14px;">Formulário: <b>${formName}</b></p>
                            <p style="color:#64748b; margin:4px 0 0 0; font-size:11px;">📅 ${submittedAt}</p>
                            <p style="color:#94a3b8; margin:4px 0 0 0; font-size:12px;">Submetido por: <b>${respondent}</b></p>
                        </div>
                        
                        <div style="background:#ffffff; padding:24px; border:1px solid #e2e8f0; border-top:none;">
                            <h3 style="margin:0 0 20px 0; font-size:13px; color:#3b82f6; text-transform:uppercase; letter-spacing:1px; border-bottom:1px solid #f1f5f9; padding-bottom:10px;">📋 Resumo Texto</h3>
                            ${answersHtml}
                        </div>

                        <div style="background:#f1f5f9; padding:24px; border:1px solid #e2e8f0; border-top:none; border-radius:0 0 12px 12px;">
                            <h3 style="margin:0 0 20px 0; font-size:13px; color:#ef4444; text-transform:uppercase; letter-spacing:1px; border-bottom:1px solid #e2e8f0; padding-bottom:10px;">🎯 Formato Visual</h3>
                            ${visualHtml}
                        </div>

                        <p style="text-align:center; font-size:11px; color:#94a3b8; margin-top:24px;">Enviado por <b>LPXForms</b> · Portal de Emergência</p>
                    </div>`;

                const toList = recipients.map(e => ({ email: e }));

                const response = await fetch('https://api.brevo.com/v3/smtp/email', {
                    method: 'POST',
                    headers: {
                        'accept': 'application/json',
                        'api-key': BREVO_API_KEY,
                        'content-type': 'application/json'
                    },
                    body: JSON.stringify({
                        sender: { name: SENDER_NAME, email: SENDER_EMAIL },
                        to: toList,
                        subject: `Nova Resposta - ${formName}`,
                        htmlContent: htmlContent
                    })
                });

                if (response.ok) {
                    console.log('[Email] Notificações enviadas via Brevo com sucesso.');
                } else {
                    const errText = await response.text();
                    console.error('[Email] Erro na resposta da API do Brevo:', errText);
                }

            } catch (err) {
                console.error('[Email] Erro ao enviar notificação:', err);
            }
        }

        window.submitResponse = async () => {
            const schema = window.currentSchema;
            const hasInventory = schema.some(b => b.type === 'inventory');
            let answers = [], hasError = false;
            schema.forEach((block, idx) => {
                if (['title','section','divider','desc','image'].includes(block.type)) return;
                let val = null; const el = document.getElementById(`ans-${idx}`);
                if (['text-short','text-long','date'].includes(block.type)) val = el?.value.trim() || null;
                else if (block.type.startsWith('choice')) {
                    const sel = Array.from(document.querySelectorAll(`#block-${idx} .pill-btn.selected`)).map(p => {
                        if (p.classList.contains('pill-other')) {
                            const inp = p.querySelector('.pill-other-input');
                            const customVal = inp ? inp.value.trim() : '';
                            return customVal ? `Outra: ${customVal}` : 'Outra';
                        }
                        return p.textContent.trim();
                    });
                    val = block.type === 'choice-single' ? (sel[0] || null) : sel;
                }
                else if (block.type === 'inventory') {
                    let rows = block.inventoryItems || [];
                    if (rows.length > 0 && !Array.isArray(rows[0])) rows = [rows];
                    val = [];
                    rows.forEach((row, rIdx) => {
                        row.forEach((item, cIdx) => {
                            const countVal = window.inventoryData[`inv-${idx}-${rIdx}-${cIdx}`];
                            val.push({
                                name: item.name || '',
                                count: countVal !== undefined ? Number(countVal) : 0
                            });
                        });
                    });
                }
                if (block.required && (!val || (Array.isArray(val) && val.length === 0))) { hasError = true; document.getElementById(`block-${idx}`).style.border = '2px solid #ef4444'; }
                answers.push({ question: block.question || '', answer: val !== undefined ? val : null, ...(block.id != null ? { blockId: block.id } : {}) });
            });

            if (hasInventory) {
                const serializedReplenishment = {
                    title: window.replenishmentTitle || "Requisição de items",
                    items: (window.replenishmentItems || []).map(item => ({
                        name: item.name || '',
                        missing: item.missing || 0,
                        requested: item.requested || 0,
                        manual: item.manual || false
                    }))
                };
                answers.push({ question: window.replenishmentTitle || "Requisição de items", answer: serializedReplenishment });
            }

            if (hasError) { alert("Preencha todos os campos obrigatórios."); return; }
            const btn = document.getElementById('submit-btn'); btn.innerText = "A enviar..."; btn.disabled = true;
            try {
                await setDoc(doc(collection(db, "responses")), {
                    formId: currentFormId,
                    submittedAt: serverTimestamp(),
                    respondent: currentUser?.email || "Anónimo",
                    answers
                });
                // Enviar notificação por email (em paralelo, não bloqueia)
                sendNotificationEmail(answers);
                document.getElementById('preview-container').innerHTML = "<div style='padding:100px; text-align:center;'><h2>Enviado!</h2><p style='color:#94a3b8'>Respostas registadas com sucesso.</p></div>";
            } catch (e) {
                alert("Erro: " + e.message);
                btn.innerText = "Submeter Formulário";
                btn.disabled = false;
            }
        };
        loadForm();
    </script>
</body>
</html>
