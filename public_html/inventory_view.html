<!DOCTYPE html>
<html lang="pt">

<head>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="0">
    <title>Inventário - Visualização Real</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1780739317">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            background-color: #080f1e;
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .inventory-container {
            width: 100%;
            max-width: 800px;
            background: #0f172a;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.6);
            padding: 40px;
        }

        .header {
            margin-bottom: 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 800;
            margin: 0;
            color: #fff;
            letter-spacing: -0.02em;
        }

        .header p {
            color: #94a3b8;
            font-size: 16px;
        }

        .style-marker {
            position: relative !important;
            padding-left: 18px !important;
        }
        .style-marker::before {
            content: "";
            position: absolute;
            left: 0;
            top: 10%;
            bottom: 10%;
            width: 5px;
            background-color: var(--marker-color);
            border-radius: 10px;
        }

        /* Pill System */
        .inv-pill-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px; /* Sync with builder gap */
            margin-bottom: 24px;
        }


        .inv-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 10px;
            /* Metade do arredondamento padrão */
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            position: relative;
        }

        .inv-pill:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-1px);
        }

        .inv-pill-name {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        .inv-pill-qt {
            display: flex;
            align-items: center;
            gap: 4px;
            padding-left: 8px;
            margin-left: 4px;
            border-left: 1px solid rgba(255, 255, 255, 0.2);
        }


        .inv-qt-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.5;
        }

        .inv-qt-value {
            font-size: 15px;
            font-weight: 800;
            color: #3b82f6;
            min-width: 16px;
            text-align: center;
        }

        .inv-qt-target {
            font-size: 11px;
            opacity: 0.4;
            font-weight: 500;
        }

        /* Status Colors */
        .inv-pill.status-red {
            border-color: rgba(239, 68, 68, 0.45);
            background: rgba(239, 68, 68, 0.08);
        }

        .inv-pill.status-red .inv-qt-value {
            color: #f87171;
        }

        .inv-pill.status-green {
            border-color: rgba(34, 197, 94, 0.45);
            background: rgba(34, 197, 94, 0.08);
        }

        .inv-pill.status-green .inv-qt-value {
            color: #4ade80;
        }

        .inv-pill.status-yellow {
            border-color: rgba(234, 179, 8, 0.45);
            background: rgba(234, 179, 8, 0.08);
        }

        .inv-pill.status-yellow .inv-qt-value {
            color: #facc15;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #e2e8f0;
            margin: 40px 0 12px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }



        .empty-msg {
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="inventory-container">
        <div id="render-target">
            <div class="empty-msg">A carregar inventário...</div>
        </div>
    </div>

    <script type="module">
        import { auth, db, doc, getDoc, onAuthStateChanged } from './firebase-config.js';

        function getContrastYIQ(hexcolor) {
            if (!hexcolor) return '#ffffff';
            hexcolor = hexcolor.replace("#", "");
            if (hexcolor.length === 3) hexcolor = hexcolor.split('').map(c => c + c).join('');
            if (hexcolor.length !== 6) return '#ffffff';
            var r = parseInt(hexcolor.substr(0, 2), 16), g = parseInt(hexcolor.substr(2, 2), 16), b = parseInt(hexcolor.substr(4, 2), 16);
            var yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            return (yiq >= 128) ? '#0f172a' : '#ffffff';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const currentFormId = urlParams.get('id');

        let currentSchema = [];
        window.pillCounters = {};

        // Load persisted counters from localStorage
        function loadCounters() {
            if (!currentFormId) return;
            const saved = localStorage.getItem(`inv_counts_${currentFormId}`);
            if (saved) {
                try {
                    window.pillCounters = JSON.parse(saved);
                } catch (e) {
                    console.error("Error loading counters:", e);
                    window.pillCounters = {};
                }
            }
        }

        // Save counters to localStorage
        function saveCounters() {
            if (!currentFormId) return;
            localStorage.setItem(`inv_counts_${currentFormId}`, JSON.stringify(window.pillCounters));
        }

        onAuthStateChanged(auth, async (user) => {
            if (currentFormId) {
                loadCounters(); // Restore progress
                const docSnap = await getDoc(doc(db, "forms", currentFormId));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    currentSchema = data.schema.map(block => {
                        if (typeof block.options === 'string') {
                            block.options = JSON.parse(block.options);
                        }
                        return block;
                    });
                    renderInventory();
                }
            }
        });

        window.wasLongPress = false;

        window.incrementPill = (blockIdx, rowIdx, colIdx) => {
            if (window.wasLongPress) {
                window.wasLongPress = false;
                return;
            }
            const key = `${blockIdx}-${rowIdx}-${colIdx}`;
            window.pillCounters[key] = (window.pillCounters[key] ?? 0) + 1;
            saveCounters(); // Persist
            updatePillUI(blockIdx, rowIdx, colIdx);
        };

        window.decrementPill = (blockIdx, rowIdx, colIdx) => {
            const key = `${blockIdx}-${rowIdx}-${colIdx}`;
            window.pillCounters[key] = Math.max(0, (window.pillCounters[key] ?? 0) - 1);
            saveCounters(); // Persist
            updatePillUI(blockIdx, rowIdx, colIdx);
        };

        window.resetPill = (blockIdx, rowIdx, colIdx) => {
            window.wasLongPress = true;
            const key = `${blockIdx}-${rowIdx}-${colIdx}`;
            delete window.pillCounters[key];
            saveCounters(); // Persist
            updatePillUI(blockIdx, rowIdx, colIdx);
            
            // Safety: if for some reason onclick never fires (e.g. mouse moved away),
            // reset the flag after a long enough delay (2 seconds).
            if (window.wasLongPressTimer) clearTimeout(window.wasLongPressTimer);
            window.wasLongPressTimer = setTimeout(() => { window.wasLongPress = false; }, 2000);
        };



        function updatePillUI(blockIdx, rowIdx, colIdx) {
            const key = `${blockIdx}-${rowIdx}-${colIdx}`;
            const val = window.pillCounters[key];
            const block = currentSchema[blockIdx];
            const target = block.options?.[rowIdx]?.[colIdx]?.target || 0;

            const pill = document.getElementById(`inv-pill-${key}`);
            const display = document.getElementById(`inv-val-${key}`);
            if (!pill || !display) return;

            display.textContent = val ?? '-';
            pill.classList.remove('status-red', 'status-yellow', 'status-green');

            if (val === undefined) return;
            if (val < target) pill.classList.add('status-red');
            else if (val === target) pill.classList.add('status-green');
            else pill.classList.add('status-yellow');
        }

        function renderInventory() {
            const target = document.getElementById('render-target');
            const titleBlock = currentSchema.find(b => b.type === 'title');
            const descBlock = currentSchema.find(b => b.type === 'desc');
            const formTitle = titleBlock ? titleBlock.content : 'Sem Título';
            const formDesc = descBlock ? descBlock.content : '';

            let headerTitleHtml = `<h1>${formTitle}</h1>`;
            if (titleBlock) {
                const bColor = titleBlock.blockColor || '';
                const bStyle = titleBlock.blockStyle || 'full';
                const bSize = titleBlock.blockSize || 'large';
                const sizeMap = { 'small': '18px', 'medium': '26px', 'large': '36px' };
                const fontSize = sizeMap[bSize] || '36px';
                
                let styleAttr = `style="font-size: ${fontSize};"`;
                let classAttr = '';
                if (bColor) {
                    const textColor = getContrastYIQ(bColor);
                    if (bStyle === 'border') {
                        styleAttr = `style="--marker-color: ${bColor}; font-size: ${fontSize}; color: #f8fafc;"`;
                        classAttr = 'class="style-marker"';
                    } else {
                        const displayStyle = bStyle === 'inline' ? 'display: inline-block; width: fit-content;' : 'display: block; width: 100%;';
                        styleAttr = `style="background-color: ${bColor}; color: ${textColor}; padding: 4px 12px; border-radius: 6px; font-size: ${fontSize}; ${displayStyle}"`;
                    }
                }
                headerTitleHtml = `<h1 ${classAttr} ${styleAttr}>${formTitle}</h1>`;
            }

            let html = `
                <div class="header">
                    ${headerTitleHtml}
                    ${formDesc ? `<p>${formDesc}</p>` : ''}
                </div>
            `;

            let hasContent = false;

            currentSchema.forEach((block, index) => {
                if (block.type === 'title' || block.type === 'desc') return;

                const bColor = block.blockColor || '';
                const bStyle = block.blockStyle || 'full';
                const bSize = block.blockSize || 'medium';

                // Heading style helper (for section, counter, choice, text blocks)
                function makeHeadingStyle(defaultSize) {
                    const sizeMap = { 'small': '14px', 'medium': defaultSize, 'large': '24px' };
                    const fontSize = sizeMap[bSize] || defaultSize;
                    if (!bColor) return { style: `font-size: ${fontSize};`, cls: '' };
                    const textColor = getContrastYIQ(bColor);
                    if (bStyle === 'border') {
                        return { style: `--marker-color: ${bColor}; font-size: ${fontSize}; color: #f8fafc;`, cls: 'style-marker' };
                    }
                    const disp = bStyle === 'inline' ? 'display: inline-block; width: fit-content;' : 'display: block; width: 100%;';
                    return { style: `background-color: ${bColor}; color: ${textColor}; padding: 4px 12px; border-radius: 6px; font-size: ${fontSize}; ${disp}`, cls: '' };
                }

                let blockStyle = 'position: relative; margin-bottom: 24px;';
                if (block.image) {
                    const y = block.imageY || 0;
                    const h = parseInt(block.imageHeight) || 150;
                    blockStyle += ` min-height: ${Math.max(40, y + h + 16)}px;`;
                }
                html += `<div class="block" style="${blockStyle}">`;

                if (block.type === 'section') {
                    hasContent = true;
                    const { style, cls } = makeHeadingStyle('18px');
                    const classes = `section-title${cls ? ' ' + cls : ''}`;
                    html += `<div class="${classes}" style="${style}">${block.question || 'Secção'}</div>`;
                }

                else if (block.type === 'counter') {
                    hasContent = true;
                    // Counter heading with block color
                    const { style, cls } = makeHeadingStyle('16px');
                    const classes = `block-question${cls ? ' ' + cls : ''}`;
                    html += `<div class="${classes}" style="${style}">${block.question || 'Inventário'}${block.required ? '<span class="required">*</span>' : ''}</div>`;

                    if (!block.options || !Array.isArray(block.options)) {
                        block.options = [[{ text: block.question || 'Item', target: block.target || 0 }]];
                    }

                    html += `<div class="inv-pill-container" style="margin-bottom: 0;">`;
                    block.options.forEach((row, rowIdx) => {
                        html += `<div class="pill-row" style="margin-bottom: 8px;">`;
                        row.forEach((opt, colIdx) => {
                            const optText = opt.text || 'Item';
                            const optTarget = opt.target || 0;
                            const optColor = opt.color || block.pillColor || '';
                            const key = `${index}-${rowIdx}-${colIdx}`;
                            const val = window.pillCounters[key];
                            const valDisplay = val ?? '-';
                            let st = '';
                            if (val !== undefined) {
                                if (val < optTarget) st = 'status-red';
                                else if (val === optTarget) st = 'status-green';
                                else st = 'status-yellow';
                            }

                            let pillExtraStyle = '';
                            if (optColor && st === '') {
                                pillExtraStyle = `background-color: ${optColor}; border-color: ${optColor}; color: ${getContrastYIQ(optColor)};`;
                            }

                            html += `
                                <div class="inv-pill ${st}" id="inv-pill-${key}" style="${pillExtraStyle}"
                                     onclick="window.incrementPill(${index}, ${rowIdx}, ${colIdx})"
                                     oncontextmenu="event.preventDefault(); window.decrementPill(${index}, ${rowIdx}, ${colIdx})"
                                     onmousedown="window.pressTimer = setTimeout(() => window.resetPill(${index}, ${rowIdx}, ${colIdx}), 700)"
                                     onmouseup="clearTimeout(window.pressTimer)"
                                     onmouseleave="clearTimeout(window.pressTimer)"
                                     ontouchstart="window.pressTimer = setTimeout(() => window.resetPill(${index}, ${rowIdx}, ${colIdx}), 700)"
                                     ontouchend="clearTimeout(window.pressTimer)">
                                    <span class="inv-pill-name">${optText}</span>
                                    <div class="inv-pill-qt">
                                        <span class="inv-qt-label">Qt</span>
                                        <span class="inv-qt-value" id="inv-val-${key}">${valDisplay}</span>
                                        <span class="inv-qt-target">/${optTarget}</span>
                                    </div>
                                </div>
                            `;
                        });
                        html += `</div>`;
                    });
                    html += `</div>`;
                }

                else if (block.type === 'choice-single' || block.type === 'choice-multi') {
                    hasContent = true;
                    const { style, cls } = makeHeadingStyle('16px');
                    const classes = `block-question${cls ? ' ' + cls : ''}`;
                    html += `<div class="${classes}" style="${style}">${block.question || 'Pergunta'}${block.required ? '<span class="required">*</span>' : ''}</div>`;
                    html += `<div class="pill-options-container">`;
                    if (block.options && Array.isArray(block.options)) {
                        block.options.forEach((row, rowIdx) => {
                            html += `<div class="pill-row" style="margin-bottom: 8px;">`;
                            row.forEach((opt, colIdx) => {
                                const optColor = opt.color || block.pillColor || '';
                                const pillStyle = optColor ? `background-color: ${optColor}; color: ${getContrastYIQ(optColor)}; border-color: transparent;` : '';
                                html += `<button class="pill-btn" style="${pillStyle}">${opt.text || 'Opção'}</button>`;
                            });
                            html += `</div>`;
                        });
                    }
                    html += `</div>`;
                }

                else if (block.type === 'text-short' || block.type === 'text-long' || block.type === 'date') {
                    hasContent = true;
                    const { style, cls } = makeHeadingStyle('16px');
                    const classes = `block-question${cls ? ' ' + cls : ''}`;
                    html += `<div class="${classes}" style="${style}">${block.question || 'Pergunta'}${block.required ? '<span class="required">*</span>' : ''}</div>`;
                    if (block.type === 'text-short') html += `<input type="text" placeholder="${block.placeholder || 'Resposta...'}">`;
                    else if (block.type === 'text-long') html += `<textarea rows="4" placeholder="${block.placeholder || 'Resposta...'}"></textarea>`;
                    else if (block.type === 'date') html += `<input type="date" style="padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: white; color-scheme: dark; font-family: inherit;">`;
                }

                else if (block.type === 'divider') {
                    html += `<hr style="border: none; border-top: 1px solid rgba(255,255,255,0.15); margin: 8px 0;">`;
                }

                if (block.image) {
                    html += `
                        <div style="position: absolute; left: ${block.imageX || 0}px; top: ${block.imageY || 0}px; width: ${block.imageWidth || 200}px; height: ${block.imageHeight || 150}px; pointer-events: none; box-sizing: border-box;">
                            <img src="${block.image}" style="width: 100%; height: 100%; object-fit: contain;">
                        </div>
                    `;
                }
                html += `</div>`;
            });

            if (!hasContent) {
                html += `<div class="empty-msg">Nenhum conteúdo encontrado neste formulário.</div>`;
            }

            target.innerHTML = html;
        }
    </script>
</body>

</html>
