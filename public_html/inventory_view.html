                                     onmousedown="window.pressTimer = setTimeout(() => window.resetPill(${index}, ${rowIdx}, ${colIdx}), 700)"
                                     onmouseup="clearTimeout(window.pressTimer)"
                                     onmouseleave="clearTimeout(window.pressTimer)"
                                     ontouchstart="window.handlePillTouchStart(event, ${index}, ${rowIdx}, ${colIdx})"
                                     ontouchmove="window.handlePillTouchMove(event)"
                                     ontouchend="window.handlePillTouchEnd(event, ${index}, ${rowIdx}, ${colIdx})"
                                     ontouchcancel="clearTimeout(window.pressTimer)">

                                    <span class="inv-pill-name">${optText}</span>
                                    <div class="inv-pill-qt">
                                        <span class="inv-qt-label">Qt</span>
                                        <span class="inv-qt-value" id="inv-val-${key}">${valDisplay}</span>
                                        <span class="inv-qt-target">/${optTarget}</span>
                                    </div>
                                </div>
                            `;
                        });
                        blockContentHtml += `</div>`;
                    });
                    blockContentHtml += `</div>`;
                    htmlBlocks += blockContentHtml;
                }

                if (!['section', 'counter', 'choice-single', 'choice-multi', 'title', 'title-h1', 'title-h2', 'title-h3', 'desc'].includes(block.type)) {
                    hasInventory = true;
                    let blockContentHtml = '';
                    const bSize = block.blockSize || 'small';
                    const sizeMap = { 'small': '20px', 'medium': '25px', 'large': '33px' };
                    const fontSize = sizeMap[bSize] || '30px';
                    const showQuestion = isUserText(block.question, 'Nova Pergunta');
                    const showDesc = block.hasDescription && isUserText(block.description, 'Descrição opcional...');
                    
                    if (showQuestion || showDesc) {
                        blockContentHtml += `<div style="display: flex; flex-direction: column; margin-bottom: 12px;">`;
                        if (showQuestion) {
                            blockContentHtml += `<div class="block-question" style="margin-bottom: 0; font-size: ${fontSize};">${block.question}${block.required ? '<span class="required">*</span>' : ''}</div>`;
                        }
                        if (showDesc) {
                            blockContentHtml += `<div class="block-description" style="font-size: 13px; color: #94a3b8; margin-top: 4px;">${block.description}</div>`;
                        }
                        blockContentHtml += `</div>`;
                    }
                    blockContentHtml += imageHtml;
                    if (block.type === 'text-short') blockContentHtml += `<input type="text" id="ans-${index}" placeholder="${block.placeholder || 'Resposta...'}" style="width:100%; box-sizing:border-box; padding:10px 14px; margin-top:4px; font-family:inherit; font-size:15px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:10px; color:#f8fafc; outline:none; transition:border-color 0.2s;" onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='rgba(255,255,255,0.12)'">`;
                    else if (block.type === 'text-long') blockContentHtml += `<textarea id="ans-${index}" rows="4" placeholder="${block.placeholder || 'Resposta...'}" style="width:100%; box-sizing:border-box; padding:10px 14px; margin-top:4px; font-family:inherit; font-size:15px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:10px; color:#f8fafc; outline:none; resize:vertical; transition:border-color 0.2s;" onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='rgba(255,255,255,0.12)'"></textarea>`;
                    else if (block.type === 'date') {
                        const today = new Date().toISOString().split('T')[0];
                        blockContentHtml += `<input type="date" id="ans-${index}" style="padding: 10px; margin-top: 4px; font-family: inherit; font-size: 15px; width: fit-content; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #f8fafc; color-scheme: dark;" value="${today}">`;
                    }
                    htmlBlocks += blockContentHtml;
                }

                htmlBlocks += `</div>`;
            });
            
            htmlBlocks += '</div>';
            html += htmlBlocks;


            if (!hasInventory) {
                html += `<div class="empty-msg">Nenhum bloco de inventário encontrado neste formulário.</div>`;
            }

            if (hasInventory) {
                const repDisplay = (window.showReplenishment === false) ? 'display:none;' : '';
                html += `<div id="replenishment-list-container" style="${repDisplay}"></div>`;
                // Submit button
                html += `
                    <div style="padding: 0; margin-bottom: 48px; margin-top: 8px;">
                        <button id="inv-submit-btn" onclick="window.submitInventory()" style="width: 100%; padding: 16px; border-radius: 12px; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.3s; box-shadow: 0 4px 20px rgba(16,185,129,0.3);" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 8px 30px rgba(16,185,129,0.4)';" onmouseout="this.style.transform=''; this.style.boxShadow='0 4px 20px rgba(16,185,129,0.3)';">
                            <i class="ph ph-paper-plane-tilt" style="font-size: 20px;"></i> Submeter Inventário
                        </button>
                    </div>
                `;
            }

            target.innerHTML = html;
            // Removed direct flex mapping from parent container. Handled in blocks-layout-grid.

            // Offset all sticky blocks hierarchically (Level 0 -> Level 1 -> Level 2 -> Level 3)
                        window._cachedBaseTopL2 = 0;
            window._cachedTopL3 = 0;

            const updateStickyOffsets = () => {
                handleUnifiedStickyCollision();
            };

            const handleUnifiedStickyCollision = () => {
                const stickyHeader = target.querySelector('.header[style*="sticky"]');
                const h1Title = stickyHeader ? stickyHeader.querySelector("h1") : null;

                const l1Blocks = Array.from(target.querySelectorAll('.block[data-sticky-level="1"], .block[style*="z-index: 115"]'));
                const l2Blocks = Array.from(target.querySelectorAll('.block[data-sticky-level="2"], .block[style*="z-index: 110"]'));
                const l3Blocks = Array.from(target.querySelectorAll('.block[data-sticky-level="3"]'));
                const l3Headers = Array.from(target.querySelectorAll(".counter-header-sticky"));

                // 0. Level 0: Main Title (H0)
                let h0Height = 0;
                if (stickyHeader && window.showMainTitle !== false) {
                    h0Height = Math.round(stickyHeader.getBoundingClientRect().height);
                }

                // 1. Level 1: Ambulância (Sections)
                // Determine which L1 is currently active based on document position
                let activeL1 = null;
                for (let i = 0; i < l1Blocks.length; i++) {
                    const cur = l1Blocks[i];
                    cur.style.top = h0Height + "px";
                    const curRect = cur.getBoundingClientRect();
                    // A block is at or past sticky top if its top is <= sticky ceiling
                    if (curRect.top <= h0Height + 2) {
                        activeL1 = cur;
                    }
                }

                const activeL1Height = activeL1 ? Math.round(activeL1.offsetHeight || 38) : 0;
                // Base top for Level 2: H0 + L1 + 2px separation
                const baseTopL2 = Math.round(h0Height + (activeL1Height > 0 ? (activeL1Height + 2) : 0));
                window._cachedBaseTopL2 = baseTopL2;

                // 2. Level 2: Cockpit / Areas
                // Only consider L2 blocks belonging to the current active L1 (or global if no L1 yet)
                let activeL2 = null;
                for (let i = 0; i < l2Blocks.length; i++) {
                    const cur = l2Blocks[i];
                    cur.style.top = baseTopL2 + "px";
                    const curRect = cur.getBoundingClientRect();
                    if (curRect.top <= baseTopL2 + 2) {
                        activeL2 = cur;
                    }
                }

                const activeL2Height = activeL2 ? Math.round(activeL2.offsetHeight || 34) : 0;
                // Base top for Level 3: baseTopL2 + L2 + 2px separation
                const topL3 = Math.round(baseTopL2 + (activeL2Height > 0 ? (activeL2Height + 2) : 0));
                window._cachedTopL3 = topL3;

                // 3. Level 3: Counter headers (Porta Luvas, Porta Verbetes, etc.)
                // Push-up collision: when next L3 header arrives at topL3, it pushes current up smoothly
                for (let i = 0; i < l3Headers.length; i++) {
                    const curHeader = l3Headers[i];
                    const nextHeader = l3Headers[i + 1];
                    const curH = Math.round(curHeader.offsetHeight || 38);

                    if (nextHeader) {
                        const nextRect = nextHeader.getBoundingClientRect();
                        if (nextRect.top < topL3 + curH && nextRect.top >= topL3) {
                            curHeader.style.top = (topL3 - ((topL3 + curH) - nextRect.top)) + "px";
                        } else if (nextRect.top < topL3) {
                            curHeader.style.top = (topL3 - curH) + "px";
                        } else {
                            curHeader.style.top = topL3 + "px";
                        }
                    } else {
                        curHeader.style.top = topL3 + "px";
                    }
                }

                // 4. Pill containment / clipping:
                // Ensure no pills ever render above the bottom edge of their counter sticky header
                for (let i = 0; i < l3Blocks.length; i++) {
                    const block = l3Blocks[i];
                    const header = block.querySelector('.counter-header-sticky');
                    const pillContainer = block.querySelector('.inv-pill-container');
                    if (!header || !pillContainer) continue;

                    const blockRect = block.getBoundingClientRect();
                    const headerRect = header.getBoundingClientRect();

                    // If header is stuck at or near topL3 and block is scrolling under it:
                    if (headerRect.top <= topL3 + 1 && blockRect.top < headerRect.bottom) {
                        // The amount of the block scrolled above header bottom
                        const clipAmount = Math.max(0, Math.round(headerRect.bottom - blockRect.top));
                        // Clip the top of pill container so pills never leak behind header or into gap
                        pillContainer.style.clipPath = `inset(${clipAmount}px 0 0 0)`;
                    } else {
                        pillContainer.style.clipPath = '';
                    }
                }
            };

            const handleL2PushCollision = handleUnifiedStickyCollision;

            if (window._l2PushScrollHandler) {
                window.removeEventListener("scroll", window._l2PushScrollHandler);
            }
            window._l2PushScrollHandler = handleL2PushCollision;
            window.addEventListener('scroll', window._l2PushScrollHandler, { passive: true });

            if (window._stickyResizeHandler) {
                window.removeEventListener('resize', window._stickyResizeHandler);
            }
            window._stickyResizeHandler = updateStickyOffsets;
            window.addEventListener('resize', window._stickyResizeHandler);

            requestAnimationFrame(() => {
                updateStickyOffsets();
                setTimeout(updateStickyOffsets, 200);
            });
if (hasInventory) {
                window.updateReplenishmentFromInventory();
            }

            document.fonts.ready.then(() => {
                adjustPillWidths();
                document.querySelectorAll('.inv-pill-name').forEach(el => fitText(el));
            });

            // Build sidebar after DOM is painted
            setTimeout(() => { if (typeof buildSidebar === 'function') buildSidebar(); }, 150);
        }
        window.renderInventory = renderInventory;

        // ======================================================
        // REPLENISHMENT LIST LOGIC
        // ======================================================

        window.updateReplenishmentFromInventory = () => {
            const schema = currentSchema || [];
            schema.forEach((block, idx) => {
                if (block.type !== 'counter') return;
                let rows = block.options || [];
                rows.forEach((row, rIdx) => {
                    row.forEach((item, cIdx) => {
                        const itemId = `${idx}-${rIdx}-${cIdx}`;
                        const countVal = window.pillCounters[itemId];

                        // Pill nunca picada ("-") → não aparece na tabela
                        if (countVal === undefined) {
                            // Remove da tabela se existia antes (ex: após reset)
                            const existingIdx = window.replenishmentItems.findIndex(i => i.id === itemId);
                            if (existingIdx !== -1) window.replenishmentItems.splice(existingIdx, 1);
                            return;
                        }

                        const count = Number(countVal);
                        const target = (item.target !== undefined && item.target !== null && item.target !== '') ? Number(item.target) : 0;
                        const missing = target - count;

                        // Aparece se count < target (inclui count=0 com target>0)
                        const shouldShow = count < target;

                        if (shouldShow) {
                            if (window.removedReplenishmentIds.has(itemId)) return;

                            const existing = window.replenishmentItems.find(i => i.id === itemId);
                            if (existing) {
                                existing.missing = missing;
                                if (!existing.hasEditedQty) existing.requested = missing;
                            } else {
                                window.replenishmentItems.push({
                                    id: itemId,
                                    name: item.text,
                                    missing: missing,
                                    requested: missing,
                                    manual: false,
                                    hasEditedQty: false
                                });
                            }
                        } else {
                            const existingIdx = window.replenishmentItems.findIndex(i => i.id === itemId);
                            if (existingIdx !== -1) window.replenishmentItems.splice(existingIdx, 1);
                        }
                    });
                });
            });
            window.saveReplenishment();
            window.renderReplenishmentList();
        };

        window.renderReplenishmentList = () => {
            const repContainer = document.getElementById('replenishment-list-container');
            if (!repContainer) return;

            let html = `
                <div class="replenishment-container">
                    <input type="text" class="replenishment-title-input" value="${window.replenishmentTitle}" oninput="window.replenishmentTitle = this.value; window.saveReplenishment();" placeholder="Título da lista...">
                    <div class="replenishment-list">
            `;

            if (window.replenishmentItems.length === 0) {
                html += `<div style="text-align: center; color: #94a3b8; padding: 20px 0; font-size: 14px;"><i class="ph ph-info" style="font-size: 20px; vertical-align: middle; margin-right: 6px;"></i>Nenhum item necessita de reposição no momento.</div>`;
            } else {
                window.replenishmentItems.forEach((item, idx) => {
                    let colorClass = '';
                    if (item.requested > item.missing) colorClass = 'color-yellow';
                    else if (item.requested < item.missing) colorClass = 'color-red';

                    const missingLabel = item.manual ? 'Adicionado manual' : `Falta: ${item.missing}`;

                    html += `
                        <div class="replenishment-row">
                            <div class="replenishment-item-name ${colorClass}">${item.name}</div>
                            <div class="replenishment-badge">${missingLabel}</div>
                            <div class="replenishment-qty-controls">
                                <button type="button" class="replenishment-qty-btn" onclick="window.changeReplenishmentQty(${idx}, -1)">−</button>
                                <input type="number" class="replenishment-qty-input" value="${item.requested}" min="0" onchange="window.setReplenishmentQty(${idx}, this.value)">
                                <button type="button" class="replenishment-qty-btn" onclick="window.changeReplenishmentQty(${idx}, 1)">+</button>
                            </div>
                            <button type="button" class="replenishment-delete-btn" onclick="window.deleteReplenishmentItem(${idx})" title="Remover item">
                                <i class="ph ph-trash"></i>
                            </button>
                        </div>
                    `;
                });
            }

            html += `
                    </div>
                    <div class="replenishment-add-form">
                        <input type="text" id="manual-item-name" class="replenishment-add-input" style="flex: 1;" placeholder="Nome do artigo a adicionar...">
                        <input type="number" id="manual-item-qty" class="replenishment-add-input" style="width: 70px; text-align: center;" value="1" min="1">
                        <button type="button" class="replenishment-add-btn" onclick="window.addManualReplenishmentItem()">
                            <i class="ph ph-plus"></i> Adicionar
                        </button>
                    </div>
                </div>
            `;

            repContainer.innerHTML = html;
        };

        window.changeReplenishmentQty = (idx, delta) => {
            const item = window.replenishmentItems[idx];
            if (!item) return;
            item.requested = Math.max(0, item.requested + delta);
            item.hasEditedQty = true;
            window.saveReplenishment();
            window.renderReplenishmentList();
        };

        window.setReplenishmentQty = (idx, val) => {
            const item = window.replenishmentItems[idx];
            if (!item) return;
            item.requested = Math.max(0, parseInt(val) || 0);
            item.hasEditedQty = true;
            window.saveReplenishment();
            window.renderReplenishmentList();
        };

        window.deleteReplenishmentItem = (idx) => {
            const item = window.replenishmentItems[idx];
            if (!item) return;
            if (!item.manual) {
                window.removedReplenishmentIds.add(item.id);
            }
            window.replenishmentItems.splice(idx, 1);
            window.saveReplenishment();
            window.renderReplenishmentList();
        };

        window.addManualReplenishmentItem = () => {
            const nameInp = document.getElementById('manual-item-name');
            const qtyInp = document.getElementById('manual-item-qty');
            if (!nameInp || !qtyInp) return;

            const name = nameInp.value.trim();
            const qty = Math.max(1, parseInt(qtyInp.value) || 1);

            if (!name) return;

            window.replenishmentItems.push({
                id: 'manual-' + Date.now(),
                name: name,
                missing: qty,
                requested: qty,
                manual: true,
                hasEditedQty: false
            });
            window.saveReplenishment();
            window.renderReplenishmentList();

            nameInp.value = '';
            qtyInp.value = '1';
            nameInp.focus();
        };

        // ======================================================
        // VISUAL PILLS (read-only repro of the inventory pills)
        // ======================================================
        window.showUncounted = true;

        // ======================================================
        // VISUAL SNAPSHOT GENERATION (For submission)
        // ======================================================
        function generateVisualSnapshot() {
            let html = '';
            let metaHtml = '';
            currentSchema.forEach((block, blockIdx) => {
                if (['title', 'title-h1', 'title-h2', 'title-h3', 'desc', 'divider', 'section'].includes(block.type)) return;
                if (['text-short', 'text-long', 'date'].includes(block.type)) {
                    const el = document.getElementById(`ans-${blockIdx}`);
                    const val = el ? el.value.trim() : '';
                    if (val) {
                        metaHtml += `<div style="margin-bottom: 8px; font-size: 13px; color: #cbd5e1;"><strong style="color: #94a3b8;">${stripHtml(block.question) || 'Pergunta'}:</strong> ${val}</div>`;
                    }
                } else if (block.type === 'choice-single' || block.type === 'choice-multi') {
                    const sel = Array.from(document.querySelectorAll(`#block-${blockIdx} .pill-btn.selected`)).map(p => p.textContent.trim());
                    const val = sel.join(', ');
                    if (val) {
                        metaHtml += `<div style="margin-bottom: 8px; font-size: 13px; color: #cbd5e1;"><strong style="color: #94a3b8;">${stripHtml(block.question) || 'Pergunta'}:</strong> ${val}</div>`;
                    }
                }
            });
            currentSchema.forEach((block, blockIdx) => {
                if (block.type !== 'counter') return;
                const rows = block.options || [];
                let blockHtml = '';
                rows.forEach((row, rowIdx) => {
                    let rowHtml = '';
                    row.forEach((opt, colIdx) => {
                        const key = `${blockIdx}-${rowIdx}-${colIdx}`;
                        const val = window.pillCounters[key];
                        const isUncounted = (val === undefined);
                        const optTarget = (opt && opt.target !== undefined && opt.target !== null && opt.target !== '') ? Number(opt.target) : 0;
                        const optText = opt.text || 'Item';

                        const valDisplay = val ?? '-';
                        let borderColor = 'rgba(255,255,255,0.08)';
                        let bg = 'rgba(255,255,255,0.04)';
                        let extraStyle = '';

                        if (isUncounted) {
                            borderColor = '#ef4444';
                            bg = 'rgba(239,68,68,0.08)';
                            extraStyle = 'box-shadow: 0 0 0 1px rgba(239,68,68,0.3);';
                        } else if (val < optTarget) {
                            borderColor = '#ef4444'; bg = 'rgba(239,68,68,0.1)';
                        } else if (val === optTarget) {
                            borderColor = '#22c55e'; bg = 'rgba(34,197,94,0.08)';
                        } else {
                            borderColor = '#f59e0b'; bg = 'rgba(245,158,11,0.08)';
                        }

                        rowHtml += `
                            <div style="display:inline-flex; align-items:center; justify-content:space-between; padding: 6px 10px; border-radius: 8px; border: 1px solid ${borderColor}; background: ${bg}; ${extraStyle} gap: 8px; min-width: 120px; max-width: 200px; flex: 1 1 120px;">
                                <span style="font-size:13px; font-weight:500; color: ${isUncounted ? '#ef4444' : '#f8fafc'}; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${optText}">${optText}</span>
                                <span style="font-size:13px; font-weight:700; color: ${isUncounted ? '#ef4444' : '#94a3b8'}; white-space:nowrap;">${valDisplay}${optTarget ? '/' + optTarget : ''}</span>
                            </div>`;
                    });
                    if (rowHtml) {
                        blockHtml += `<div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px;">${rowHtml}</div>`;
                    }
                });

                if (blockHtml) {
                    const sectionLabel = block.question ? `<div style="font-size:12px; font-weight:600; color:#60a5fa; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px;">${block.question}</div>` : '';
                    html += `<div style="margin-bottom:16px;">${sectionLabel}${blockHtml}</div>`;
                }
            });

            if (!html) {
                html = `<div style="text-align:center; color:#94a3b8; padding: 16px 0; font-size:14px;"><i class="ph ph-info" style="vertical-align:middle; margin-right:6px;"></i>Nenhum item de inventário encontrado.</div>`;
            }
            if (metaHtml) {
                html = `<div style="margin-bottom: 20px; padding: 12px 16px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px;">${metaHtml}</div>` + html;
            }
            return html;
        }

        // ======================================================
        // SIDEBAR NAVIGATION
        // ======================================================
        let sidebarObserver = null;

        function buildSidebar() {
            const sidebarItemsContainer = document.getElementById('sidebar-items');
            if (!sidebarItemsContainer) return;
            
            sidebarItemsContainer.innerHTML = '';
            
            const stickyHeaders = document.querySelectorAll('.sidebar-target');
            if (!stickyHeaders.length) {
                document.getElementById('progress-sidebar').style.display = 'none';
                return;
            } else {
                document.getElementById('progress-sidebar').style.display = '';
            }

            const headerTargets = [];

            // 3-tier hierarchy:
            // Level 0: Main Title Header (.header)
            // Level 1: Primary Category (z-index 115, e.g. Ambulância)
            // Level 2: Subcategory / Area (z-index 110 without pills, e.g. Cockpit, Célula Sanitária)
            // Level 3: Counter blocks / zones (with pills / items, e.g. Porta Luvas, Estante 1)
            let currentL1Group = null;
            let currentL1Sub = null;
            let currentL2Group = null;
            let currentL2Sub = null;

            stickyHeaders.forEach((titleEl, index) => {
                const titleText = (titleEl.innerText || `Secção ${index + 1}`).trim();
                const blockColor = titleEl.dataset.blockColor || '';
                const hasBlockColor = !!blockColor;
                
                const blockDiv = titleEl.closest('.block, .header');
                if (!blockDiv) return;

                const blockId = `nav-block-${index}`;
                blockDiv.id = blockId;
                headerTargets.push({ id: blockId, element: blockDiv });

                const isMainHeader = blockDiv.classList.contains('header');
                const hasCounter = !!blockDiv.querySelector('.inv-pill-container, .pill-options-container');

                const isL0 = isMainHeader;
                const isL1 = !isMainHeader && (blockDiv.style.zIndex === '115' || blockDiv.getAttribute('style')?.includes('z-index: 115'));
                const isL2 = !isMainHeader && (blockDiv.style.zIndex === '110' || blockDiv.getAttribute('style')?.includes('z-index: 110')) && !hasCounter;
                const isL3 = hasCounter || (!isL0 && !isL1 && !isL2);

                const itemHtml = document.createElement('div');
                itemHtml.className = 'sidebar-item';
                itemHtml.dataset.targetId = blockId;

                // Color styling
                if (hasBlockColor) {
                    const contrastColor = getContrastYIQ(blockColor);
                    itemHtml.style.setProperty('--item-bg', blockColor);
                    itemHtml.style.setProperty('--item-color', contrastColor);
                    itemHtml.style.setProperty('--item-border', blockColor);
                    itemHtml.style.setProperty('--item-active-bg', blockColor);
                    itemHtml.style.setProperty('--item-active-color', contrastColor);
                    itemHtml.style.setProperty('--item-active-border', contrastColor);
                    itemHtml.style.setProperty('--item-hover-bg', 'rgba(255, 255, 255, 0.15)');
                    itemHtml.dataset.blockColor = blockColor;
                }

                if (isL0) {
                    itemHtml.classList.add('is-level-0');
                    itemHtml.innerHTML = `<i class="ph ph-folder" style="font-size:14px;flex-shrink:0;"></i> <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${titleText}</span>`;
                    sidebarItemsContainer.appendChild(itemHtml);
                } else if (isL1) {
                    itemHtml.classList.add('is-level-1');
                    currentL1Group = document.createElement('div');
                    currentL1Group.className = 'sidebar-category-group';

                    const chevron = document.createElement('span');
                    chevron.className = 'sidebar-item-chevron expanded';
                    chevron.innerHTML = '▶';
                    itemHtml.appendChild(chevron);

                    const label = document.createElement('span');
                    label.style.cssText = 'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
                    label.innerText = titleText;
                    itemHtml.appendChild(label);

                    currentL1Sub = document.createElement('div');
                    currentL1Sub.className = 'sidebar-sub-l2-container';

                    currentL1Group.appendChild(itemHtml);
                    currentL1Group.appendChild(currentL1Sub);
                    sidebarItemsContainer.appendChild(currentL1Group);

                    itemHtml.dataset.hasChildren = 'true';
                    itemHtml._subContainer = currentL1Sub;
                    itemHtml._chevron = chevron;

                    // Reset level 2 tracker for this new level 1 category
                    currentL2Group = null;
                    currentL2Sub = null;
                } else if (isL2) {
                    itemHtml.classList.add('is-level-2');
                    currentL2Group = document.createElement('div');
                    currentL2Group.className = 'sidebar-category-group';

                    const chevron = document.createElement('span');
                    chevron.className = 'sidebar-item-chevron expanded';
                    chevron.innerHTML = '▶';
                    itemHtml.appendChild(chevron);

                    const label = document.createElement('span');
                    label.style.cssText = 'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
                    label.innerText = titleText;
                    itemHtml.appendChild(label);

                    currentL2Sub = document.createElement('div');
                    currentL2Sub.className = 'sidebar-sub-l3-container';

                    currentL2Group.appendChild(itemHtml);
                    currentL2Group.appendChild(currentL2Sub);

                    if (currentL1Sub) {
                        currentL1Sub.appendChild(currentL2Group);
                    } else {
                        sidebarItemsContainer.appendChild(currentL2Group);
                    }

                    itemHtml.dataset.hasChildren = 'true';
                    itemHtml._subContainer = currentL2Sub;
                    itemHtml._chevron = chevron;
                } else {
                    // Level 3 items (counter blocks with pills)
                    itemHtml.classList.add('is-level-3');
                    const colorDot = hasBlockColor
                        ? `<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${blockColor};flex-shrink:0;"></span>`
                        : `<span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:#94a3b8;flex-shrink:0;"></span>`;
                    itemHtml.innerHTML = `${colorDot} <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${titleText}</span>`;

                    if (currentL2Sub) {
                        currentL2Sub.appendChild(itemHtml);
                    } else if (currentL1Sub) {
                        currentL1Sub.appendChild(itemHtml);
                    } else {
                        sidebarItemsContainer.appendChild(itemHtml);
                    }
                }

                // Attach Slide Gestures (Touch & Mouse Drag) for direct subcategory expand/collapse
                let touchStartX = 0;
                let touchStartY = 0;
                itemHtml.addEventListener('touchstart', (e) => {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }, { passive: true });

                itemHtml.addEventListener('touchend', (e) => {
                    const diffX = e.changedTouches[0].clientX - touchStartX;
                    const diffY = e.changedTouches[0].clientY - touchStartY;
                    if (Math.abs(diffX) > 30 && Math.abs(diffX) > Math.abs(diffY)) {
                        if (diffX > 0 && itemHtml._subContainer) {
                            // Slide Right (->): expand direct subcategories
                            itemHtml._subContainer.classList.remove('collapsed');
                            if (itemHtml._chevron) itemHtml._chevron.classList.add('expanded');
                        } else if (diffX < 0 && itemHtml._subContainer) {
                            // Slide Left (<-): collapse direct subcategories
                            itemHtml._subContainer.classList.add('collapsed');
                            if (itemHtml._chevron) itemHtml._chevron.classList.remove('expanded');
                        }
                    }
                }, { passive: true });

                let mouseDownX = 0;
                itemHtml.addEventListener('mousedown', (e) => { mouseDownX = e.clientX; });
                itemHtml.addEventListener('mouseup', (e) => {
                    const diffX = e.clientX - mouseDownX;
                    if (Math.abs(diffX) > 28) {
                        if (diffX > 0 && itemHtml._subContainer) {
                            // Slide Right (->): expand direct subcategories
                            itemHtml._subContainer.classList.remove('collapsed');
                            if (itemHtml._chevron) itemHtml._chevron.classList.add('expanded');
                        } else if (diffX < 0 && itemHtml._subContainer) {
                            // Slide Left (<-): collapse direct subcategories
                            itemHtml._subContainer.classList.add('collapsed');
                            if (itemHtml._chevron) itemHtml._chevron.classList.remove('expanded');
                        }
                    }
                });

                // Toggle click on chevron
                if (itemHtml._chevron) {
                    itemHtml._chevron.onclick = (e) => {
                        e.stopPropagation();
                        const isCollapsed = itemHtml._subContainer.classList.toggle('collapsed');
                        itemHtml._chevron.classList.toggle('expanded', !isCollapsed);
                    };
                }

                // Click event to scroll smoothly accounting for sticky header ceiling (teto)
                itemHtml.onclick = () => {
                    setActiveItem(blockId);
                    window._sidebarScrollLock = true;
                    clearTimeout(window._sidebarScrollLockTimer);
                    window._sidebarScrollLockTimer = setTimeout(() => {
                        window._sidebarScrollLock = false;
                    }, 1200);

                    if (blockDiv.classList.contains('header')) {
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    } else {
                        const isCounter = blockDiv.querySelector('.counter-header-sticky') !== null;
                        const isL2Block = blockDiv.style.zIndex === '110' || blockDiv.getAttribute('style')?.includes('z-index: 110');
                        const isL1Block = blockDiv.style.zIndex === '115' || blockDiv.getAttribute('style')?.includes('z-index: 115');
                        
                        const h0 = document.querySelector('.header[style*="sticky"]');
                        const h0H = (h0 && window.showMainTitle !== false) ? h0.getBoundingClientRect().height : 0;
                        
                        let ceiling = h0H;
                        if (isL1Block) {
                            ceiling = h0H;
                        } else if (isL2Block) {
                            ceiling = window._cachedBaseTopL2 || (h0H + 48);
                        } else if (isCounter) {
                            ceiling = window._cachedTopL3 || (h0H + 48 + 36);
                        } else {
                            ceiling = window._cachedTopL3 || 155;
                        }

                        const blockRect = blockDiv.getBoundingClientRect();
                        const targetScrollY = window.scrollY + blockRect.top - ceiling + 2;
                        window.scrollTo({ top: Math.max(0, targetScrollY), behavior: 'smooth' });
                    }
                };
            });

            // Global Expand / Collapse Button Setup
            let allExpanded = true;
            const toggleAllBtn = document.getElementById('sidebar-toggle-all-btn');
            const toggleTextEl = document.getElementById('sidebar-toggle-text');
            if (toggleAllBtn && toggleTextEl) {
                toggleAllBtn.onclick = () => {
                    allExpanded = !allExpanded;
                    toggleTextEl.innerText = allExpanded ? 'Colapsar' : 'Expandir';
                    toggleAllBtn.querySelector('i').className = allExpanded ? 'ph ph-arrows-in-simple' : 'ph ph-arrows-out-simple';

                    document.querySelectorAll('.sidebar-sub-l2-container, .sidebar-sub-l3-container').forEach(sub => {
                        if (allExpanded) sub.classList.remove('collapsed');
                        else sub.classList.add('collapsed');
                    });
                    document.querySelectorAll('.sidebar-item-chevron').forEach(chev => {
                        if (allExpanded) chev.classList.add('expanded');
                        else chev.classList.remove('expanded');
                    });
                };
            }

            // Scroll-aware active state (Sticky Ceiling Tracking)
            const firstSidebarItem = sidebarItemsContainer.querySelector('.sidebar-item');

            const setActiveItem = (targetId) => {
                document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
                const activeItem = targetId
                    ? document.querySelector(`.sidebar-item[data-target-id="${targetId}"]`)
                    : firstSidebarItem;
                if (activeItem) {
                    activeItem.classList.add('active');
                    // If active item is inside a collapsed container, auto-expand its ancestors so it is visible!
                    let parentSub = activeItem.closest('.sidebar-sub-l2-container, .sidebar-sub-l3-container');
                    while (parentSub) {
                        parentSub.classList.remove('collapsed');
                        const parentGroup = parentSub.closest('.sidebar-category-group');
                        const pChev = parentGroup ? parentGroup.querySelector('.sidebar-item-chevron') : null;
                        if (pChev) pChev.classList.add('expanded');
                        parentSub = parentGroup ? parentGroup.parentElement?.closest('.sidebar-sub-l2-container, .sidebar-sub-l3-container') : null;
                    }
                    activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            };

            // Accurate scroll spy using sticky ceiling
            window._sidebarScrollSpy = () => {
                if (window._sidebarScrollLock) return;
                
                const ceilingL3 = window._cachedTopL3 || 167;
                const ceilingL2 = window._cachedBaseTopL2 || 125;
                const h0 = document.querySelector('.header[style*="sticky"]');
                const h0H = (h0 && window.showMainTitle !== false) ? h0.getBoundingClientRect().height : 0;

                if (window.scrollY < Math.max(30, h0H / 2)) {
                    setActiveItem(firstSidebarItem ? firstSidebarItem.dataset.targetId : null);
                    return;
                }

                // Evaluate all targets from bottom to top to find the one currently under sticky ceiling
                let activeId = null;
                for (let i = headerTargets.length - 1; i >= 0; i--) {
                    const target = headerTargets[i];
                    if (!target.element) continue;
                    const r = target.element.getBoundingClientRect();
                    
                    const isCounter = !!target.element.querySelector('.counter-header-sticky');
                    const isL2 = target.element.style.zIndex === '110' || target.element.getAttribute('style')?.includes('z-index: 110');
                    const isL1 = target.element.style.zIndex === '115' || target.element.getAttribute('style')?.includes('z-index: 115');
                    
                    let threshold = ceilingL3;
                    if (isL1) threshold = h0H;
                    else if (isL2) threshold = ceilingL2;
                    else if (isCounter) threshold = ceilingL3;

                    // If top of block is at or above threshold (+12px tolerance for sticky catch), this block has arrived/is active
                    if (r.top <= threshold + 12 && r.bottom > threshold) {
                        activeId = target.id;
                        break;
                    }
                }

                if (activeId) {
                    setActiveItem(activeId);
                }
            };

            window.addEventListener('scroll', window._sidebarScrollSpy, { passive: true });
            window._sidebarScrollSpy();

            // Mobile Drawer toggle controllers
            const mToggleBtn = document.getElementById('mobile-sidebar-toggle-btn');
            const mBackdrop = document.getElementById('sidebar-mobile-backdrop');
            const sidebarEl = document.getElementById('progress-sidebar');

            function openMobileSidebar() {
                if (!sidebarEl || !mToggleBtn) return;
                sidebarEl.classList.add('mobile-open');
                if (mBackdrop) mBackdrop.classList.add('active');
                mToggleBtn.classList.remove('collapsed');
                mToggleBtn.classList.add('open');
                mToggleBtn.innerHTML = '<i class="ph ph-caret-left"></i>';
                mToggleBtn.setAttribute('aria-label', 'Fechar índice');
            }

            function closeMobileSidebar() {
                if (!sidebarEl || !mToggleBtn) return;
                sidebarEl.classList.remove('mobile-open');
                if (mBackdrop) mBackdrop.classList.remove('active');
                mToggleBtn.classList.remove('open');
                mToggleBtn.classList.add('collapsed');
                mToggleBtn.innerHTML = '<i class="ph ph-caret-right"></i>';
                mToggleBtn.setAttribute('aria-label', 'Abrir índice');
            }

            if (mToggleBtn) {
                mToggleBtn.onclick = () => {
                    if (sidebarEl.classList.contains('mobile-open')) {
                        closeMobileSidebar();
                    } else {
                        openMobileSidebar();
                    }
                };
            }

            if (mBackdrop) {
                mBackdrop.onclick = closeMobileSidebar;
            }

            // On mobile, clicking a level 3 subcategory navigates and smoothly auto-closes the drawer
            sidebarItemsContainer.querySelectorAll('.sidebar-item.is-level-3').forEach(item => {
                item.addEventListener('click', () => {
                    if (window.innerWidth <= 1150) {
                        setTimeout(closeMobileSidebar, 200);
                    }
                });
            });
        }

                });
            } catch(e) {
                console.error('Submit error:', e);
                alert('Erro ao submeter: ' + e.message);
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ph ph-paper-plane-tilt"></i> Submeter Inventário'; }
            }
        };

        // ======================================================
        // SWITCH LOCATION IN VIEW
        // ======================================================
        window.switchViewLocation = function(locId) {
            if (!window.useLocations || !window.locations) return;
            window.activeLocationId = locId;
            localStorage.setItem(`inv_active_loc_${currentFormId}`, locId);
            
            if (locId === 'outra') {
                currentSchema = JSON.parse(JSON.stringify(window.templateSchema || []));
            } else {
                const newLoc = window.locations.find(l => l.id === locId);
                if (newLoc && newLoc.schema) {
                    let locSchema = newLoc.schema;
                    if (typeof locSchema === 'string') {
                        try { locSchema = JSON.parse(locSchema); } catch(e) { locSchema = []; }
                    }
                    if (Array.isArray(locSchema) && locSchema.length > 5) {
                        currentSchema = locSchema.map(block => {
                            if (typeof block.options === 'string') {
                                try { block.options = JSON.parse(block.options); } catch(e) { block.options = []; }
                            }
                            return block;
                        });
                    } else {
                        currentSchema = JSON.parse(JSON.stringify(window.templateSchema || []));
                    }
                } else {
                    currentSchema = JSON.parse(JSON.stringify(window.templateSchema || []));
                }
                if (!Array.isArray(currentSchema)) currentSchema = [];
            }
            window.pillCounters = {};
            window.replenishmentItems = [];
            window.removedReplenishmentIds = new Set();
            loadCounters();
            loadReplenishment();
            renderInventory(); // renderInventory already calls renderVisualPills internally
        };

        window.updateCustomLocationName = function(val) {
            localStorage.setItem(`inv_custom_loc_${currentFormId}`, val);
        };

        // ======================================================
        // REAL-TIME SYNC FROM EDITOR (BroadcastChannel)
        // ======================================================
        try {
            const invOptionsBc = new BroadcastChannel('inv_options');
            invOptionsBc.onmessage = (e) => {
                if (e.data.type === 'showReplenishment') {
                    window.showReplenishment = e.data.value;
                    const container = document.getElementById('replenishment-list-container');
                    if (container) {
                        container.style.display = window.showReplenishment ? '' : 'none';
                        if (window.showReplenishment) {
                            window.updateReplenishmentFromInventory();
                        }
                    }
                } else if (e.data.type === 'showMainTitle') {
                    window.showMainTitle = e.data.value;
                    const header = document.querySelector('.header');
                    if (header) {
                        header.style.display = window.showMainTitle ? '' : 'none';
                    }
                } else if (e.data.type === 'replenishmentTitle') {
                    window.replenishmentTitle = e.data.value;
                    const titleInp = document.querySelector('.replenishment-title-input');
                    if (titleInp) {
                        titleInp.value = e.data.value;
                    }
                } else if (e.data.type === 'useLocationsChanged') {
                    window.useLocations = e.data.value;
                    window.locations = e.data.locations || [];
                    window.activeLocationId = e.data.activeLocationId || (window.locations[0] ? window.locations[0].id : null);
                    window.locations.forEach(loc => {
                        if (loc.schema && Array.isArray(loc.schema)) loc.schema.forEach(b => { if (typeof b.options === 'string') b.options = JSON.parse(b.options); });
                    });
                    if (window.useLocations && window.activeLocationId) {
                        if (window.activeLocationId === 'outra') {
                            currentSchema = JSON.parse(JSON.stringify(window.templateSchema || []));
                        } else {
                            const al = window.locations.find(l => l.id === window.activeLocationId);
                            currentSchema = al ? (al.schema || []) : [];
                        }
                    }
                    window.pillCounters = {};
                    loadCounters();
                    loadReplenishment();
                    renderInventory();
                } else if (e.data.type === 'locationChanged') {
                    window.switchViewLocation(e.data.value);
                }
            };
        } catch(e) {}
    </script>
</body>

</html>
