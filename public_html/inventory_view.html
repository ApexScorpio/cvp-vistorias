<!DOCTYPE html>
<html lang="pt">

<head>

    <title>Inventário - Visualização Real</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1780739317">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            background-color: #080f1e;
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .progress-sidebar {
            position: sticky;
            top: 40px;
            width: 250px;
            background: #0f172a;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.6);
            padding: 20px;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-right: 40px;
        }
        .progress-sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .progress-sidebar::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .sidebar-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }
        .sidebar-title {
            font-size: 13px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0;
            padding: 0;
            border: none;
        }
        .sidebar-toggle-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #cbd5e1;
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }
        .sidebar-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .sidebar-category-group {
            margin-bottom: 4px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .sidebar-item {
            font-size: 13px;
            color: var(--item-color, #cbd5e1);
            background: var(--item-bg, transparent);
            cursor: pointer;
            padding: 7px 10px;
            border-radius: 8px;
            transition: all 0.2s;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
            touch-action: pan-y;
            position: relative;
        }
        .sidebar-item:hover {
            background: var(--item-hover-bg, rgba(255, 255, 255, 0.06));
            filter: brightness(1.15);
            transform: translateX(2px);
        }

        /* Level 0: Main form title item */
        .sidebar-item.is-level-0 {
            font-size: 13px;
            font-weight: 700;
            opacity: 0.9;
            margin-bottom: 4px;
        }

        /* Level 1: Category Header (ex: Ambulância) */
        .sidebar-item.is-level-1 {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.01em;
            margin-top: 3px;
        }

        /* Level 2: Subcategory / Area Header (ex: Cockpit, Célula Sanitária) */
        .sidebar-item.is-level-2 {
            font-size: 12.5px;
            font-weight: 600;
        }

        /* Level 3: Zone / Room / Pill Counters (ex: Porta Luvas, Estante 1) */
        .sidebar-item.is-level-3 {
            font-size: 12px;
            font-weight: 500;
            padding: 5px 8px;
        }

        /* Nested Tree Containers with crisp guideline borders */
        .sidebar-sub-l2-container {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-left: 12px;
            padding-left: 8px;
            border-left: 1.5px solid rgba(255, 255, 255, 0.15);
            transition: all 0.25s ease;
        }
        .sidebar-sub-l3-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-left: 12px;
            padding-left: 8px;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.25s ease;
        }

        .sidebar-sub-l2-container.collapsed,
        .sidebar-sub-l3-container.collapsed {
            display: none !important;
        }

        .sidebar-item-chevron {
            font-size: 10px;
            opacity: 0.6;
            transition: transform 0.2s;
            margin-right: 2px;
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 2px;
            flex-shrink: 0;
        }
        .sidebar-item-chevron.expanded {
            transform: rotate(90deg);
        }

        /* Active highlight for scroll spy and selection */
        .sidebar-item.active {
            background: var(--item-active-bg, rgba(59, 130, 246, 0.1));
            color: var(--item-active-color, #60a5fa);
            font-weight: 700;
            outline: 2px solid #ffffff !important;
            outline-offset: -2px;
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.4) !important;
            filter: brightness(1.2);
            opacity: 1;
        }
        /* Mobile Off-Canvas Drawer & Mid-Height Toggle Button */
        @media (max-width: 1150px) {
            body {
                padding: 16px 12px !important;
            }
            .inventory-container {
                padding: 20px 16px !important;
            }

            .progress-sidebar {
                display: flex !important;
                position: fixed !important;
                top: 0 !important;
                bottom: 0 !important;
                left: 0 !important;
                width: 290px !important;
                max-width: 82vw !important;
                height: 100vh !important;
                max-height: 100vh !important;
                border-radius: 0 20px 20px 0 !important;
                z-index: 2000 !important;
                margin-right: 0 !important;
                box-shadow: 12px 0 50px rgba(0, 0, 0, 0.75) !important;
                transform: translateX(-100%);
                transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1) !important;
                padding: 24px 18px !important;
                background: #0f172a !important;
                border-right: 1.5px solid rgba(255, 255, 255, 0.14) !important;
                border-top: none !important;
                border-left: none !important;
                border-bottom: none !important;
            }

            .progress-sidebar.mobile-open {
                transform: translateX(0) !important;
            }

            .sidebar-mobile-backdrop {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0, 0, 0, 0.65);
                backdrop-filter: blur(3px);
                z-index: 1999;
                opacity: 0;
                transition: opacity 0.3s ease;
            }
            .sidebar-mobile-backdrop.active {
                display: block;
                opacity: 1;
            }

            /* Floating button positioned at 50% screen height */
            .mobile-sidebar-toggle-btn {
                display: flex !important;
                position: fixed;
                top: 50%;
                transform: translateY(-50%);
                width: 38px;
                height: 54px;
                background: #1e293b;
                color: #f8fafc;
                border: 1.5px solid rgba(255, 255, 255, 0.22);
                box-shadow: 4px 4px 20px rgba(0, 0, 0, 0.5), 0 0 12px rgba(59, 130, 246, 0.3);
                cursor: pointer;
                z-index: 2001;
                align-items: center;
                justify-content: center;
                font-size: 20px;
                transition: left 0.35s cubic-bezier(0.32, 0.72, 0, 1), background 0.2s, border-color 0.2s;
                user-select: none;
            }

            /* When collapsed: arrow points right (outwards) from left screen edge */
            .mobile-sidebar-toggle-btn.collapsed {
                left: 0;
                border-radius: 0 14px 14px 0;
                border-left: none;
            }

            /* When open: attached to the sidebar edge, arrow points left (inwards) to collapse */
            .mobile-sidebar-toggle-btn.open {
                left: 290px;
                border-radius: 0 14px 14px 0;
                background: #0f172a;
                border-left: none;
            }
            @media (max-width: 350px) {
                .mobile-sidebar-toggle-btn.open {
                    left: 82vw;
                }
            }
        }

        /* Desktop: mobile elements hidden */
        @media (min-width: 1151px) {
            .mobile-sidebar-toggle-btn,
            .sidebar-mobile-backdrop {
                display: none !important;
            }
        }
        .inventory-container {
            width: 100%;
            max-width: 800px;
            background: #0f172a;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.6);
            padding: 40px;
            overflow-x: clip;
        }

        .header {
            margin-bottom: 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 800;
            margin: 0;
            color: #fff;
            letter-spacing: -0.02em;
        }

        .header p {
            color: #94a3b8;
            font-size: 16px;
        }

        .style-marker {
            position: relative !important;
            padding-left: 18px !important;
        }
        .style-marker::before {
            content: "";
            position: absolute;
            left: 0;
            top: 10%;
            bottom: 10%;
            width: 5px;
            background-color: var(--marker-color);
            border-radius: 10px;
        }

        /* Pill System */
        .inv-pill-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px; /* Sync with builder gap */
            margin-bottom: 24px;
            width: 100%;
        }

        .pill-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            width: 100%;
        }

        .pill-options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .pill-btn {
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(255, 255, 255, 0.12);
            color: inherit;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pill-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .pill-btn.selected {
            border: 3px solid #ffffff !important;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.7) !important;
            transform: scale(1.05);
            z-index: 10;
        }

        @keyframes pillSlideLeftAnim {
            0% {
                transform: translateX(0);
            }
            30% {
                transform: translateX(-16px);
                background-color: rgba(239, 68, 68, 0.25);
                box-shadow: 0 0 14px rgba(239, 68, 68, 0.45);
            }
            60% {
                transform: translateX(-6px);
            }
            100% {
                transform: translateX(0);
            }
        }

        .inv-pill.anim-swipe-left {
            animation: pillSlideLeftAnim 0.35s cubic-bezier(0.25, 1, 0.5, 1) !important;
        }

        .inv-pill {
            display: flex;
            align-items: stretch;
            padding: 0 !important;
            border-radius: 10px;
            border: 1.5px solid rgba(255, 255, 255, 0.22);
            background: transparent;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
            touch-action: pan-y pinch-zoom;
            position: relative;
        }

        .inv-pill, .inv-pill * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
        }

        .inv-pill:hover {
            border-color: rgba(255, 255, 255, 0.45);
            transform: translateY(-1px);
        }

        /* Left part: Item description carries the full background color */
        .inv-pill-name {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            padding: 8px 14px;
            background-color: var(--pill-bg, rgba(255, 255, 255, 0.08));
            color: var(--pill-text, #ffffff);
            font-size: 13.5px;
            font-weight: 600;
            line-height: 1.25;
            letter-spacing: -0.01em;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: normal;
        }

        /* Right part: Quantidade zone is ALWAYS dark/neutral, NEVER receives the pill color */
        .inv-pill-qt {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            margin: 0;
            border-left: 1.5px solid rgba(255, 255, 255, 0.18);
            background: rgba(15, 23, 42, 0.92) !important;
            background-color: rgba(15, 23, 42, 0.92) !important;
        }

        .inv-qt-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.6;
            color: #94a3b8;
        }

        .inv-qt-value {
            font-size: 16px;
            font-weight: 800;
            color: #94a3b8;
            min-width: 16px;
            text-align: center;
        }

        .inv-qt-target {
            font-size: 11px;
            opacity: 0.45;
            font-weight: 500;
            color: #94a3b8;
        }

        /* --- PROMINENT HALO WITH DOUBLE CONTRAST RING --- */
        /* Anel escuro de corte (2px #0b1120) para o halo destacar vibrantemente mesmo em pills da mesma cor! */
        .inv-pill.status-green {
            border-color: #22c55e !important;
            box-shadow: 0 0 0 2px #0b1120, 0 0 0 4px #22c55e, 0 0 22px rgba(34, 197, 94, 0.95) !important;
        }
        .inv-pill.status-green .inv-pill-qt {
            background: rgba(34, 197, 94, 0.14) !important;
            background-color: rgba(34, 197, 94, 0.14) !important;
            border-left-color: rgba(34, 197, 94, 0.5) !important;
        }
        .inv-pill.status-green .inv-pill-qt .inv-qt-label {
            color: #4ade80 !important;
            opacity: 1 !important;
            font-weight: 800 !important;
        }
        .inv-pill.status-green .inv-pill-qt .inv-qt-value {
            color: #4ade80 !important;
            font-size: 17px !important;
            font-weight: 900 !important;
            text-shadow: 0 0 12px rgba(34, 197, 94, 0.9) !important;
        }

        .inv-pill.status-red {
            border-color: #ef4444 !important;
            box-shadow: 0 0 0 2px #0b1120, 0 0 0 4px #ef4444, 0 0 22px rgba(239, 68, 68, 0.95) !important;
        }
        .inv-pill.status-red .inv-pill-qt {
            background: rgba(239, 68, 68, 0.14) !important;
            background-color: rgba(239, 68, 68, 0.14) !important;
            border-left-color: rgba(239, 68, 68, 0.5) !important;
        }
        .inv-pill.status-red .inv-pill-qt .inv-qt-label {
            color: #f87171 !important;
            opacity: 1 !important;
            font-weight: 800 !important;
        }
        .inv-pill.status-red .inv-pill-qt .inv-qt-value {
            color: #f87171 !important;
            font-size: 17px !important;
            font-weight: 900 !important;
            text-shadow: 0 0 12px rgba(239, 68, 68, 0.9) !important;
        }

        .inv-pill.status-yellow {
            border-color: #eab308 !important;
            box-shadow: 0 0 0 2px #0b1120, 0 0 0 4px #eab308, 0 0 22px rgba(234, 179, 8, 0.95) !important;
        }
        .inv-pill.status-yellow .inv-pill-qt {
            background: rgba(234, 179, 8, 0.14) !important;
            background-color: rgba(234, 179, 8, 0.14) !important;
            border-left-color: rgba(234, 179, 8, 0.5) !important;
        }
        .inv-pill.status-yellow .inv-pill-qt .inv-qt-label {
            color: #fde047 !important;
            opacity: 1 !important;
            font-weight: 800 !important;
        }
        .inv-pill.status-yellow .inv-pill-qt .inv-qt-value {
            color: #fde047 !important;
            font-size: 17px !important;
            font-weight: 900 !important;
            text-shadow: 0 0 12px rgba(234, 179, 8, 0.9) !important;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #e2e8f0;
            margin: 40px 0 12px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }



        .empty-msg {
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-style: italic;
        }

        .block {
            position: relative;
            margin-bottom: 24px;
            padding: 8px 12px;
            margin-left: -12px;
            margin-right: -12px;
        }

        .block-question {
            font-size: 16px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 24px;
        }

        .required {
            color: #f87171;
            font-size: 14px;
        }

        /* Replenishment List CSS */
        .replenishment-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            margin-top: 32px;
            margin-bottom: 32px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .replenishment-title-input {
            background: transparent;
            border: none;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.15);
            color: #f8fafc;
            font-size: 20px;
            font-weight: 700;
            width: 100%;
            padding: 4px 0;
            margin-bottom: 20px;
            outline: none;
            transition: border-bottom-color 0.2s;
        }
        .replenishment-title-input:focus {
            border-bottom-color: #3b82f6;
        }
        .replenishment-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            gap: 12px;
        }
        .replenishment-item-name {
            font-weight: 600;
            font-size: 15px;
            flex: 1;
            transition: color 0.2s;
            color: #f8fafc;
        }
        .replenishment-item-name.color-yellow {
            color: #fbbf24 !important;
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.4);
        }
        .replenishment-item-name.color-red {
            color: #f43f5e !important;
            text-shadow: 0 0 8px rgba(244, 63, 94, 0.4);
        }
        .replenishment-badge {
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            white-space: nowrap;
        }
        .replenishment-qty-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .replenishment-qty-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s;
        }
        .replenishment-qty-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }
        .replenishment-qty-input {
            width: 48px;
            height: 28px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: white;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            outline: none;
        }
        .replenishment-qty-input::-webkit-inner-spin-button, 
        .replenishment-qty-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .replenishment-delete-btn {
            background: none;
            border: none;
            color: #f43f5e;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .replenishment-delete-btn:hover {
            background: rgba(244, 63, 94, 0.1);
            transform: scale(1.1);
        }
        .replenishment-add-form {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            box-sizing: border-box;
            width: 100%;
        }

        @media (max-width: 768px) {
            .replenishment-container {
                padding: 14px 10px !important;
                margin: 20px 0 0 0 !important;
                max-width: 100% !important;
                box-sizing: border-box !important;
            }
            .replenishment-add-form {
                flex-wrap: wrap !important;
                gap: 8px !important;
            }
            .replenishment-add-form #manual-item-name {
                flex: 1 1 100% !important;
                width: 100% !important;
                min-width: 0 !important;
                box-sizing: border-box !important;
            }
            .replenishment-add-form #manual-item-qty {
                flex: 0 0 75px !important;
                width: 75px !important;
                box-sizing: border-box !important;
            }
            .replenishment-add-form .replenishment-add-btn {
                flex: 1 1 auto !important;
                width: auto !important;
                justify-content: center !important;
                box-sizing: border-box !important;
            }
            .replenishment-table {
                width: 100% !important;
            }
        }
        .replenishment-add-input {
            background: rgba(0, 0, 0, 0.2) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 8px !important;
            padding: 8px 12px !important;
            font-size: 14px !important;
            height: 38px !important;
            color: white !important;
        }
        .replenishment-add-btn {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            height: 38px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .replenishment-add-btn:hover {
            background: #2563eb;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }
        .cover-image-placeholder { width: 100%; height: 220px; background-color: var(--theme-hero-start, #0f172a); background-image: linear-gradient(135deg, var(--theme-hero-start, #0f172a) 0%, var(--theme-hero-end, #020617) 100%); background-size: contain !important; background-repeat: no-repeat !important; background-position: center !important; margin-bottom: 0; position: relative; }
    @media (max-width: 600px) { .cover-image-placeholder { height: 160px; } }
</style>

<body>
    <div id="sidebar-mobile-backdrop" class="sidebar-mobile-backdrop"></div>
    <button id="mobile-sidebar-toggle-btn" class="mobile-sidebar-toggle-btn collapsed" aria-label="Abrir índice">
        <i class="ph ph-caret-right"></i>
    </button>
    <div id="progress-sidebar" class="progress-sidebar">
        <div class="sidebar-header-row">
            <span class="sidebar-title">Índice</span>
            <button id="sidebar-toggle-all-btn" class="sidebar-toggle-btn" title="Expandir ou colapsar todas as categorias">
                <i class="ph ph-arrows-in-simple"></i> <span id="sidebar-toggle-text">Colapsar</span>
            </button>
        </div>
        <div id="sidebar-items"></div>
    </div>
    <div class="inventory-container">
        <div id="render-target">
            <div class="empty-msg">A carregar inventário...</div>
        </div>
    </div>

    <script type="module">
        import { auth, db, doc, getDoc, collection, setDoc, onAuthStateChanged, serverTimestamp } from './firebase-config.js';

        const stripHtml = (html) => (html || '').replace(/<\/?[^>]+(>|$)/g, '').trim();

        function getContrastYIQ(hexcolor) {
            if (!hexcolor) return '#ffffff';
            hexcolor = hexcolor.replace("#", "");
            if (hexcolor.length === 3) hexcolor = hexcolor.split('').map(c => c + c).join('');
            if (hexcolor.length !== 6) return '#ffffff';
            var r = parseInt(hexcolor.substr(0, 2), 16), g = parseInt(hexcolor.substr(2, 2), 16), b = parseInt(hexcolor.substr(4, 2), 16);
            var yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            return (yiq >= 128) ? '#0f172a' : '#ffffff';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const currentFormId = urlParams.get('id');

        let currentSchema = [];
        Object.defineProperty(window, 'currentSchema', { get() { return currentSchema; }, set(v) { currentSchema = v; } });
        window.pillCounters = {};
        let pillSizingConfig = { mode: 'global', type: 'dynamic', sharedWidth: 200 };

        function fitText(el) {
            if (!el) return;
            const parentWrapper = el.closest('.inv-pill') || el.closest('.pill-edit-wrapper');
            const actualHeight = parentWrapper ? parentWrapper.offsetHeight : 42;
            let size = 14;
            el.style.fontSize = size + 'px';
            let maxH = actualHeight - 8;
            if (maxH < 20) maxH = 34;
            while (size > 9 && el.scrollHeight > maxH + 1) {
                size -= 0.5;
                el.style.fontSize = size + 'px';
            }
        }

        function adjustPillWidths() {
            const config = pillSizingConfig;
            const pills = document.querySelectorAll('.inv-pill');
            
            if (config.type === 'fixed') {
                pills.forEach(pill => {
                    const blockIdx = parseInt(pill.dataset.blockidx);
                    const rowIdx = parseInt(pill.dataset.rowidx);
                    const colIdx = parseInt(pill.dataset.colidx);
                    const block = currentSchema[blockIdx];
                    const opt = (block && block.options && block.options[rowIdx]) ? block.options[rowIdx][colIdx] : null;
                    
                    let w = config.sharedWidth || 200;
                    if (config.mode === 'individual') {
                        w = (opt && typeof opt === 'object' && opt.width !== undefined) ? opt.width : 200;
                    }
                    
                    let h = config.sharedHeight || 42;
                    if (config.mode === 'individual') {
                        h = (opt && typeof opt === 'object' && opt.height !== undefined) ? opt.height : h;
                    }
                    
                    pill.style.width = `${w}px`;
                    pill.style.boxSizing = 'border-box';
                    pill.style.justifyContent = 'space-between';
                    pill.style.setProperty('min-height', `${h}px`, 'important');
                    pill.style.setProperty('height', 'auto', 'important');
                    pill.style.setProperty('max-height', '80px', 'important');
                });
            } else {
                // Dynamic sizing: reset first
                pills.forEach(pill => {
                    const blockIdx = parseInt(pill.dataset.blockidx);
                    const rowIdx = parseInt(pill.dataset.rowidx);
                    const colIdx = parseInt(pill.dataset.colidx);
                    const block = currentSchema[blockIdx];
                    const opt = (block && block.options && block.options[rowIdx]) ? block.options[rowIdx][colIdx] : null;

                    let h = config.sharedHeight || 42;
                    if (config.mode === 'individual') {
                        h = (opt && typeof opt === 'object' && opt.height !== undefined) ? opt.height : h;
                    }

                    pill.style.boxSizing = 'border-box';
                    pill.style.justifyContent = 'space-between';
                    pill.style.setProperty('min-height', `${h}px`, 'important');
                    pill.style.setProperty('height', 'auto', 'important');
                    pill.style.setProperty('max-height', '80px', 'important');
                });

                const getTextWidth = (text, font) => {
                    const canvas = getTextWidth.canvas || (getTextWidth.canvas = document.createElement("canvas"));
                    const context = canvas.getContext("2d");
                    context.font = font;
                    return context.measureText(text).width;
                };

                const font = "500 14px Outfit, sans-serif";

                if (config.mode === 'global') {
                    let maxVal = 0;
                    currentSchema.forEach(block => {
                        if (block.type !== 'counter' && !['choice-single', 'choice-multi'].includes(block.type)) return;
                        if (!block.options || !Array.isArray(block.options)) return;
                        block.options.forEach(row => {
                            row.forEach(opt => {
                                const text = opt.text || '';
                                const textWidth = getTextWidth(text, font);
                                const isCounter = block.type === 'counter';
                                const extra = isCounter ? 85 : 45;
                                const naturalWidth = textWidth + extra;
                                if (naturalWidth > maxVal) {
                                    maxVal = naturalWidth;
                                }
                            });
                        });
                    });

                    const finalWidth = Math.min(310, Math.max(120, maxVal));

                    pills.forEach(pill => {
                        pill.style.width = `${finalWidth}px`;
                        pill.style.maxWidth = 'none';
                    });
                } else {
                    pills.forEach(pill => {
                        const blockIdx = parseInt(pill.dataset.blockidx);
                        const rowIdx = parseInt(pill.dataset.rowidx);
                        const colIdx = parseInt(pill.dataset.colidx);
                        const block = currentSchema[blockIdx];
                        const opt = block.options[rowIdx][colIdx];
                        const text = opt.text || '';
                        const textWidth = getTextWidth(text, font);
                        const isCounter = block.type === 'counter';
                        const extra = isCounter ? 85 : 45;
                        const finalWidth = Math.min(310, Math.max(120, textWidth + extra));
                        pill.style.width = `${finalWidth}px`;
                        pill.style.maxWidth = 'none';
                    });
                }
            }
        }

        // Load persisted counters from localStorage
        function loadCounters() {
            if (!currentFormId) return;
            const suffix = (window.useLocations && window.activeLocationId) ? `_${window.activeLocationId}` : '';
            const saved = localStorage.getItem(`inv_counts_${currentFormId}${suffix}`);
            if (saved) {
                try {
                    window.pillCounters = JSON.parse(saved);
                } catch (e) {
                    console.error("Error loading counters:", e);
                    window.pillCounters = {};
                }
            } else {
                window.pillCounters = {};
            }
        }

        // Save counters to localStorage
        function saveCounters() {
            if (!currentFormId) return;
            const suffix = (window.useLocations && window.activeLocationId) ? `_${window.activeLocationId}` : '';
            localStorage.setItem(`inv_counts_${currentFormId}${suffix}`, JSON.stringify(window.pillCounters));
        }

        window.replenishmentTitle = "Requisição de items";
        window.replenishmentItems = [];
        window.removedReplenishmentIds = new Set();

        function loadReplenishment() {
            if (!currentFormId) return;
            const suffix = (window.useLocations && window.activeLocationId) ? `_${window.activeLocationId}` : '';
            const savedItems = localStorage.getItem(`inv_rep_items_${currentFormId}${suffix}`);
            const savedTitle = localStorage.getItem(`inv_rep_title_${currentFormId}${suffix}`);
            const savedRemoved = localStorage.getItem(`inv_rep_removed_${currentFormId}${suffix}`);
            if (savedItems) {
                try { window.replenishmentItems = JSON.parse(savedItems); } catch(e) {}
            } else {
                window.replenishmentItems = [];
            }
            if (savedTitle) {
                window.replenishmentTitle = savedTitle;
            } else {
                window.replenishmentTitle = "Requisição de items";
            }
            if (savedRemoved) {
                try { window.removedReplenishmentIds = new Set(JSON.parse(savedRemoved)); } catch(e) {}
            } else {
                window.removedReplenishmentIds = new Set();
            }
        }

        window.saveReplenishment = function saveReplenishment() {
            if (!currentFormId) return;
            const suffix = (window.useLocations && window.activeLocationId) ? `_${window.activeLocationId}` : '';
            localStorage.setItem(`inv_rep_items_${currentFormId}${suffix}`, JSON.stringify(window.replenishmentItems));
            localStorage.setItem(`inv_rep_title_${currentFormId}${suffix}`, window.replenishmentTitle);
            localStorage.setItem(`inv_rep_removed_${currentFormId}${suffix}`, JSON.stringify([...window.removedReplenishmentIds]));
        }

        // ---- PREVIEW MODE ----
        const _invUrlParams = new URLSearchParams(window.location.search);
        const _isPreviewMode = _invUrlParams.get('preview') === 'true';
        window.isPreviewMode = _isPreviewMode;

        if (_isPreviewMode) {
            // Show preview banner
            const banner = document.createElement('div');
            banner.id = 'inv-preview-banner';
            banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#7c3aed;color:#fff;text-align:center;padding:8px 16px;font-size:13px;font-weight:600;letter-spacing:0.04em;';
            banner.innerHTML = '<i class="ph ph-eye" style="margin-right:6px;"></i> MODO PREVIEW — Esta é uma pré-visualização. Submissão desativada.';
            document.body.prepend(banner);

            const localSchema = localStorage.getItem('lp_preview_schema');
            if (localSchema) {
                // Use setTimeout(0) so this runs AFTER the full script is evaluated
                // (window.updateReplenishmentFromInventory is defined later in the file)
                setTimeout(() => {
                    try {
                        const previewData = JSON.parse(localSchema);
                        let previewCfg = {};
                        try { previewCfg = JSON.parse(localStorage.getItem('lp_preview_config') || '{}'); } catch(e) {}
                        window.currentFormConfig = { schema: previewData, isInventory: true, theme: previewCfg.theme || {} };
                        window.showReplenishment = previewCfg.showReplenishment !== undefined ? previewCfg.showReplenishment : true;
                        window.showMainTitle = previewCfg.showMainTitle !== undefined ? previewCfg.showMainTitle : true;
                        window.replenishmentTitle = previewCfg.replenishmentTitle || 'Requisição de items';
                        window.useLocations = false;
                        window.locations = [];
                        window.templateSchema = previewData;
                        currentSchema = previewData.map(block => {
                            if (typeof block.options === 'string') {
                                try { block.options = JSON.parse(block.options); } catch(e) { block.options = []; }
                            }
                            return block;
                        });
                        loadCounters();
                        loadReplenishment();
                        renderInventory(); // now all window.* functions are defined
                    } catch(e) {
                        console.error('Preview schema parse error:', e);
                    }
                }, 0);
                // Skip Firebase load
            } else {
                loadFromFirebaseDirectly();
            }
        } else {
            loadFromFirebaseDirectly();
        }

        async function loadFromFirebaseDirectly() {
            if (!currentFormId) {
                const app = document.getElementById('render-target') || document.getElementById('inventory-app');
                if (app) app.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8;">Nenhum ID de formulário especificado.</div>';
                return;
            }
            try {
                const docSnap = await getDoc(doc(db, "forms", currentFormId));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    window.currentFormConfig = data;
                    window.showReplenishment = (data.showReplenishment !== false);
                    window.showMainTitle = (data.showMainTitle !== false);
                    if (data.pillSizing) {
                        pillSizingConfig = data.pillSizing;
                        if (!pillSizingConfig.sharedHeight) pillSizingConfig.sharedHeight = 42;
                        if (pillSizingConfig.showMainTitle !== undefined) {
                            window.showMainTitle = (pillSizingConfig.showMainTitle !== false);
                        }
                    }

                    window.useLocations = data.useLocations || false;
                    window.locations = data.locations || [];

                    // Store raw template schema
                    window.templateSchema = data.schema || [];
                    window.templateSchema.forEach(block => {
                        if (typeof block.options === 'string') {
                            try { block.options = JSON.parse(block.options); } catch(e) { block.options = []; }
                        }
                    });

                    window.locations.forEach(loc => {
                        if (typeof loc.schema === 'string') {
                            try { loc.schema = JSON.parse(loc.schema); } catch(e) { loc.schema = []; }
                        }
                        if (loc.schema && Array.isArray(loc.schema)) {
                            loc.schema.forEach(block => {
                                if (typeof block.options === 'string') {
                                    try { block.options = JSON.parse(block.options); } catch(e) { block.options = []; }
                                }
                            });
                        }
                    });

                    window.activeLocationId = localStorage.getItem(`inv_active_loc_${currentFormId}`) || 'outra';

                    if (window.useLocations && window.activeLocationId && window.activeLocationId !== 'outra') {
                        const activeLoc = window.locations.find(l => l.id === window.activeLocationId);
                        if (activeLoc && activeLoc.schema) {
                            let locSchema = activeLoc.schema;
                            if (typeof locSchema === 'string') {
                                try { locSchema = JSON.parse(locSchema); } catch(e) { locSchema = []; }
                            }
                            if (Array.isArray(locSchema) && locSchema.length > 5) {
                                currentSchema = locSchema;
                            } else {
                                currentSchema = JSON.parse(JSON.stringify(window.templateSchema || data.schema || []));
                            }
                        } else {
                            currentSchema = JSON.parse(JSON.stringify(window.templateSchema || data.schema || []));
                        }
                    } else {
                        currentSchema = JSON.parse(JSON.stringify(window.templateSchema || data.schema || []));
                    }

                    if (!Array.isArray(currentSchema)) {
                        if (typeof currentSchema === 'string') {
                            try { currentSchema = JSON.parse(currentSchema); } catch(e) { currentSchema = []; }
                        }
                        if (!Array.isArray(currentSchema)) currentSchema = [];
                    }

                    currentSchema = currentSchema.map(block => {
                        if (typeof block.options === 'string') {
                            try { block.options = JSON.parse(block.options); } catch(e) { block.options = []; }
                        }
                        return block;
                    });

                    loadCounters();
                    loadReplenishment();
                    renderInventory();
                } else {
                    const app = document.getElementById('render-target') || document.getElementById('inventory-app');
                    if (app) app.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8;">Formulário não encontrado.</div>';
                }
            } catch(err) {
                console.error("Erro ao carregar formulário:", err);
                const app = document.getElementById('render-target') || document.getElementById('inventory-app');
                if (app) app.innerHTML = '<div style="text-align:center;padding:40px;color:#ef4444;">Erro ao carregar inventário: ' + (err.message || err) + '</div>';
            }
        }


        window.wasLongPress = false;
        window.wasSwipeAction = false;

        // Slide/touch management for pills
        window.handlePillTouchStart = (e, blockIdx, rowIdx, colIdx) => {
            const touch = e.touches[0];
            window._pillTouchStartX = touch.clientX;
            window._pillTouchStartY = touch.clientY;
            window._pillTouchStartT = Date.now();
            window._pillTouchTarget = { blockIdx, rowIdx, colIdx };
            window.wasSwipeAction = false;
            
            // Set timer for long-press reset (700ms)
            if (window.pressTimer) clearTimeout(window.pressTimer);
            window.pressTimer = setTimeout(() => {
                window.resetPill(blockIdx, rowIdx, colIdx);
            }, 700);
        };

        window.handlePillTouchMove = (e) => {
            if (!window._pillTouchStartX || !e.touches[0]) return;
            const deltaX = e.touches[0].clientX - window._pillTouchStartX;
            const deltaY = e.touches[0].clientY - window._pillTouchStartY;
            // If movement is detected, cancel long-press reset timer
            if (Math.abs(deltaX) > 10 || Math.abs(deltaY) > 10) {
                if (window.pressTimer) clearTimeout(window.pressTimer);
            }
        };

        window.handlePillTouchEnd = (e, blockIdx, rowIdx, colIdx) => {
            if (window.pressTimer) clearTimeout(window.pressTimer);
            
            if (window._pillTouchStartX !== undefined && e.changedTouches && e.changedTouches[0]) {
                const deltaX = e.changedTouches[0].clientX - window._pillTouchStartX;
                const deltaY = e.changedTouches[0].clientY - window._pillTouchStartY;
                const timeDiff = Date.now() - (window._pillTouchStartT || 0);

                // Swipe Left gesture: deltaX < -25px and predominantly horizontal
                if (deltaX < -25 && Math.abs(deltaX) > Math.abs(deltaY) * 1.1 && timeDiff < 800) {
                    window.wasSwipeAction = true;
                    window.decrementPill(blockIdx, rowIdx, colIdx);
                    
                    // Reset swipe flag after short delay to prevent click firing
                    setTimeout(() => { window.wasSwipeAction = false; }, 350);
                    window._pillTouchStartX = undefined;
                    return;
                }
            }
            window._pillTouchStartX = undefined;
        };

        window.incrementPill = (blockIdx, rowIdx, colIdx) => {
            if (window.wasLongPress) {
                window.wasLongPress = false;
                return;
            }
            if (window.wasSwipeAction) {
                window.wasSwipeAction = false;
                return;
            }
            const key = `${blockIdx}-${rowIdx}-${colIdx}`;
            window.pillCounters[key] = (window.pillCounters[key] ?? 0) + 1;
            saveCounters(); // Persist
            updatePillUI(blockIdx, rowIdx, colIdx);
            if (typeof window.updateReplenishmentFromInventory === 'function') {
                window.updateReplenishmentFromInventory();
            }
        };

        window.decrementPill = (blockIdx, rowIdx, colIdx) => {
            const key = `${blockIdx}-${rowIdx}-${colIdx}`;
            window.pillCounters[key] = Math.max(0, (window.pillCounters[key] ?? 0) - 1);
            saveCounters(); // Persist
            updatePillUI(blockIdx, rowIdx, colIdx);
            if (typeof window.updateReplenishmentFromInventory === 'function') {
                window.updateReplenishmentFromInventory();
            }

            // Animate pill on decrement / swipe left
            const pillEl = document.getElementById(`inv-pill-${key}`);
            if (pillEl) {
                pillEl.classList.remove('anim-swipe-left');
                void pillEl.offsetWidth; // Trigger reflow
                pillEl.classList.add('anim-swipe-left');
                setTimeout(() => { pillEl.classList.remove('anim-swipe-left'); }, 400);
            }
        };

        window.resetPill = (blockIdx, rowIdx, colIdx) => {
            window.wasLongPress = true;
            const key = `${blockIdx}-${rowIdx}-${colIdx}`;
            delete window.pillCounters[key];
            saveCounters(); // Persist
            updatePillUI(blockIdx, rowIdx, colIdx);
            if (typeof window.updateReplenishmentFromInventory === 'function') {
                window.updateReplenishmentFromInventory();
            }
            
            // Safety: if for some reason onclick never fires (e.g. mouse moved away),
            // reset the flag after a long enough delay (2 seconds).
            if (window.wasLongPressTimer) clearTimeout(window.wasLongPressTimer);
            window.wasLongPressTimer = setTimeout(() => { window.wasLongPress = false; }, 2000);
        };

        window.togglePill = (btn, isMulti) => {
            const blockEl = btn.closest('.block'), wasSelected = btn.classList.contains('selected');
            if (!isMulti) {
                blockEl.querySelectorAll('.pill-btn').forEach(p => p.classList.remove('selected'));
                if (!wasSelected) btn.classList.add('selected');
            } else { btn.classList.toggle('selected'); }
        };



        function updatePillUI(blockIdx, rowIdx, colIdx) {
            const key = `${blockIdx}-${rowIdx}-${colIdx}`;
            const val = window.pillCounters[key];
            const block = currentSchema[blockIdx];
            const target = block.options?.[rowIdx]?.[colIdx]?.target || 0;

            const pill = document.getElementById(`inv-pill-${key}`);
            const display = document.getElementById(`inv-val-${key}`);
            if (!pill || !display) return;

            display.textContent = val ?? '-';
            pill.classList.remove('status-red', 'status-yellow', 'status-green');
            const blockColor = block.pillColor || block.blockColor || '';
            const optColor = (block.options?.[rowIdx]?.[colIdx]?.color) || blockColor;

            if (val === undefined) {
                if (optColor) {
                    pill.style.borderColor = optColor;
                    pill.style.setProperty('--pill-bg', optColor);
                    pill.style.setProperty('--pill-text', getContrastYIQ(optColor));
                } else {
                    pill.style.borderColor = '';
                    pill.style.removeProperty('--pill-bg');
                    pill.style.removeProperty('--pill-text');
                }
                return;
            }
            
            // When counted:
            // Pill retains --pill-bg on the description (.inv-pill-name)
            // Border is handled by status aura (status-red, status-green, status-yellow)
            if (optColor) {
                pill.style.borderColor = '';
                pill.style.setProperty('--pill-bg', optColor);
                pill.style.setProperty('--pill-text', getContrastYIQ(optColor));
            } else {
                pill.style.borderColor = '';
                pill.style.removeProperty('--pill-bg');
                pill.style.removeProperty('--pill-text');
            }

            if (val < target) pill.classList.add('status-red');
            else if (val === target) pill.classList.add('status-green');
            else pill.classList.add('status-yellow');
        }

        function renderInventory() {
            const target = document.getElementById('render-target');
            const titleBlock = currentSchema.find(b => ['title', 'title-h1', 'title-h2', 'title-h3'].includes(b.type));
            const descBlock = currentSchema.find(b => b.type === 'desc');
            const formTitle = titleBlock ? (titleBlock.question || titleBlock.content) : 'Sem Título';
            const formDesc = descBlock ? (descBlock.question || descBlock.content || descBlock.description) : '';

            let headerTitleHtml = `<h1 class="sidebar-target">${formTitle}</h1>`;
            if (titleBlock) {
                const bColor = titleBlock.blockColor || '';
                const bStyle = titleBlock.blockStyle || 'full';
                const bSize = titleBlock.blockSize || 'large';
                const sizeMap = { 'small': '20px', 'medium': '25px', 'large': '33px' };
                const fontSize = sizeMap[bSize] || '54px';
                
                let styleAttr = `style="font-size: ${fontSize};"`;
                let classAttr = 'class="sidebar-target"';
                if (bColor) {
                    const textColor = getContrastYIQ(bColor);
                    if (bStyle === 'border') {
                        styleAttr = `style="--marker-color: ${bColor}; font-size: ${fontSize}; color: #f8fafc;"`;
                        classAttr = 'class="style-marker sidebar-target"';
                    } else {
                        const displayStyle = bStyle === 'inline' ? 'display: inline-block; width: fit-content;' : 'display: block; width: 100%;';
                        styleAttr = `style="background-color: ${bColor}; color: ${textColor}; padding: 4px 12px; border-radius: 6px; font-size: ${fontSize}; ${displayStyle}"`;
                    }
                }
                const dataColor = bColor ? ` data-block-color="${bColor}"` : '';
                headerTitleHtml = `<h1 ${classAttr} ${styleAttr}${dataColor}>${formTitle}</h1>`;
            }

            const titleIsSticky = titleBlock && titleBlock.isSticky !== false;
            const headerStyle = titleIsSticky
                ? 'position: sticky; top: 0; z-index: 120; background-color: #0f172a; margin-bottom: 0; padding-bottom: 6px; margin-left: -40px; margin-right: -40px; padding-left: 40px; padding-right: 40px;'
                : '';

            let locationsSelectorHtml = '';
            if (window.useLocations && window.locations && window.locations.length > 0) {
                const listWithOutra = [...window.locations];
                if (!listWithOutra.some(loc => loc.id === 'outra')) {
                    listWithOutra.push({ id: 'outra', name: 'Outra', icon: '📝' });
                }

                let customInputHtml = '';
                if (window.activeLocationId === 'outra') {
                    const customLocVal = localStorage.getItem(`inv_custom_loc_${currentFormId}`) || '';
                    customInputHtml = `
                        <div class="custom-location-container" style="margin-top: 12px; width: 100%;">
                            <label style="display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px;">Especificar Localização:</label>
                            <input type="text" id="custom-location-name-input" placeholder="Escreva o nome da localização..." value="${customLocVal}"
                                   style="width: 100%; box-sizing: border-box; background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #f8fafc; padding: 10px; font-family: inherit; font-size: 14px; outline: none; transition: border-color 0.2s;"
                                   onfocus="this.style.borderColor='#10b981'" onblur="this.style.borderColor='rgba(255,255,255,0.15)'"
                                   oninput="window.updateCustomLocationName(this.value)">
                        </div>
                    `;
                }

                locationsSelectorHtml = `
                    <div class="locations-selector-view" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; padding: 16px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; width: 100%; box-sizing: border-box;">
                        <div style="display: flex; flex-wrap: wrap; gap: 8px; width: 100%;">
                            ${listWithOutra.map(loc => {
                                const isActive = loc.id === window.activeLocationId;
                                const activeStyle = isActive 
                                    ? 'background: #10b981; color: white; border-color: #10b981; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);' 
                                    : 'background: rgba(255,255,255,0.05); color: #f8fafc; border-color: rgba(255,255,255,0.1);';
                                return `
                                    <button type="button" class="loc-view-btn" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 20px; border: 1px solid; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; ${activeStyle}"
                                            onclick="window.switchViewLocation('${loc.id}')">
                                        <span style="font-size: 16px;">${loc.icon || '🚑'}</span>
                                        <span>${loc.name}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                        ${customInputHtml}
                    </div>
                `;
            }

            let titleImageHtml = '';
            if (titleBlock && titleBlock.image) {
                const inFlow = titleBlock.imageInFlow === true;
                const zMode = titleBlock.imageZ || 'front';
                const zIndexVal = zMode === 'back' ? -1 : 10;
                const imgStyle = inFlow
                    ? `position: relative; margin: 16px 0; left: ${titleBlock.imageX || '0'}px; top: ${titleBlock.imageY || '0'}px; width: ${titleBlock.imageWidth || '200'}px; height: ${titleBlock.imageHeight || 'auto'}px; box-sizing: border-box; display: block; z-index: ${zIndexVal};`
                    : `position: absolute; left: ${titleBlock.imageX || '0'}px; top: ${titleBlock.imageY || '0'}px; width: ${titleBlock.imageWidth || '200'}px; height: ${titleBlock.imageHeight || 'auto'}px; pointer-events: none; box-sizing: border-box; z-index: ${zIndexVal};`;
                    
                titleImageHtml = `
                    <div class="block-image-wrapper" style="${imgStyle}">
                        <img src="${titleBlock.image}" style="width: 100%; height: 100%; object-fit: contain;">
                    </div>
                `;
            }


            let coverHtml = '';
            if (window.currentFormConfig && window.currentFormConfig.theme && window.currentFormConfig.theme.coverImage) {
                coverHtml = `<div class="cover-image-placeholder" style="background-image: url('${window.currentFormConfig.theme.coverImage}')"></div>`;
            }

            let html = `
                ${coverHtml}
                <div class="header" style="${headerStyle} ${window.showMainTitle === false ? 'display: none;' : ''}">

                    ${headerTitleHtml}
                    ${titleImageHtml}
                    ${formDesc ? `<p>${formDesc}</p>` : ''}
                </div>
                ${locationsSelectorHtml}
            `;

            let htmlBlocks = '<div class="blocks-layout-grid" style="display: flex; flex-wrap: wrap; gap: 0px; width: 100%; align-items: flex-start;">';

            let hasInventory = false;
            const firstTitleIndex = currentSchema.findIndex(b => ['title', 'title-h1', 'title-h2', 'title-h3'].includes(b.type));
            const firstDescIndex = currentSchema.findIndex(b => b.type === 'desc');

            const isUserText = (val) => {
                if (!val) return false;
                const clean = val.trim().toLowerCase();
                if (!clean || clean === 'descrição opcional...') return false;
                return true;
            };

            currentSchema.forEach((block, index) => {
                if (index === firstTitleIndex || index === firstDescIndex) return;
                const isSticky = ['section', 'counter', 'title', 'title-h1', 'title-h2', 'title-h3'].includes(block.type) && block.isSticky !== false;
                // Precise classification of levels:
                // Level 1: Primary Section ("Ambulância" - large/default title, non-inline)
                const isL1 = (['title', 'title-h1'].includes(block.type) && (block.blockSize === 'large' || !block.blockSize) && block.blockStyle !== 'inline');
                // Level 2: Sub-section / Area ("Cockpit", "Célula Sanitária" - title-h2, section, or medium title, NEVER counter)
                const isL2 = block.type !== 'counter' && (block.type === 'title-h2' || block.type === 'section' || (block.type === 'title' && (block.blockSize === 'medium' || block.blockStyle === 'inline')));
                const isCounter = block.type === 'counter';
                const isSectionLevelBlock = isL1 || isL2;

                const nextBlock = currentSchema[index + 1];
                const isFollowedBySection = nextBlock && (['section', 'title', 'title-h1', 'title-h2', 'title-h3'].includes(nextBlock.type));
                let mb = '28px';
                if (isL1) mb = '0px';
                else if (isL2) mb = '0px';
                else if (!isFollowedBySection && isSectionLevelBlock) mb = '0px';

                let blockStyle = `position: relative; padding-top: 0; padding-bottom: 0; margin-bottom: ${mb}; background-color: #0f172a;`;
                let stickyLevelAttr = '';
                if (isL1 && isSticky) {
                    blockStyle = `position: sticky; top: 0; z-index: 115; padding-top: 0; padding-bottom: 0px; margin-bottom: ${mb}; background-color: #0f172a;`;
                    stickyLevelAttr = ' data-sticky-level="1"';
                } else if (isL2 && isSticky) {
                    blockStyle = `position: sticky; top: 0; z-index: 110; padding-top: 0; padding-bottom: 0px; margin-bottom: ${mb}; background-color: #0f172a;`;
                    stickyLevelAttr = ' data-sticky-level="2"';
                } else if (isCounter) {
                    stickyLevelAttr = ' data-sticky-level="3"';
                }

                const blockGroup = block.blockGroup;
                let groupCount = 1;
                if (blockGroup) {
                    let startIdx = index;
                    while (startIdx > 0 && currentSchema[startIdx - 1].blockGroup === blockGroup) {
                        startIdx--;
                    }
                    let endIdx = index;
                    while (endIdx < currentSchema.length - 1 && currentSchema[endIdx + 1].blockGroup === blockGroup) {
                        endIdx++;
                    }
                    groupCount = (endIdx - startIdx) + 1;
                }

                let blockWidthStyle = 'flex: 1 1 100%; max-width: 100%;';
                if (blockGroup && groupCount > 1) {
                    const widthPct = (100 / groupCount);
                    blockWidthStyle = `flex: 1 1 calc(${widthPct}% - 12px); max-width: calc(${widthPct}% - 12px); box-sizing: border-box;`;
                }

                let imageHtml = '';
                if (block.image) {
                    if (!block.imageInFlow) {
                        const y = block.imageY || 0;
                        const h = parseInt(block.imageHeight) || 150;
                        const bottom = y + h;
                        blockStyle += ` min-height: ${Math.max(50, bottom)}px;`;
                    }
                    
                    const inFlow = block.imageInFlow === true;
                    const zMode = block.imageZ || 'front';
                    const zIndexVal = zMode === 'back' ? -1 : 10;
                    const imgStyle = inFlow
                        ? `position: relative; margin: 16px 0; left: ${block.imageX || '0'}px; top: ${block.imageY || '0'}px; width: ${block.imageWidth || '200'}px; height: ${block.imageHeight || 'auto'}px; box-sizing: border-box; display: block; z-index: ${zIndexVal};`
                        : `position: absolute; left: ${block.imageX || '0'}px; top: ${block.imageY || '0'}px; width: ${block.imageWidth || '200'}px; height: ${block.imageHeight || 'auto'}px; pointer-events: none; box-sizing: border-box; z-index: ${zIndexVal};`;
                        
                    imageHtml = `
                        <div class="block-image-wrapper" style="${imgStyle}">
                            <img src="${block.image}" style="width: 100%; height: 100%; object-fit: contain;">
                        </div>
                    `;
                }
                htmlBlocks += `<div class="block" id="block-${index}"${stickyLevelAttr} style="${blockStyle} ${blockWidthStyle}">`;

                if (['title', 'title-h1', 'title-h2', 'title-h3'].includes(block.type)) {
                    const bColor = block.blockColor || '';
                    const bStyle = block.blockStyle || 'full';
                    let defaultSize = 'large';
                    if (block.type === 'title-h2') defaultSize = 'medium';
                    if (block.type === 'title-h3') defaultSize = 'small';
                    const bSize = block.blockSize || defaultSize;
                    const sizeMap = { 'small': '20px', 'medium': '25px', 'large': '33px' };
                    const fontSize = sizeMap[bSize] || '54px';
                    
                    let wrapperStyle = 'display: flex; flex-direction: column; width: 100%; margin-bottom: 4px;';
                    let titleStyle = `font-size: ${fontSize}; line-height: 1.2; font-weight: 700; color: #f8fafc;`;
                    let titleClass = 'block-title sidebar-target';
                    
                    if (bColor) {
                        const textColor = getContrastYIQ(bColor);
                        if (bStyle === 'border') {
                            titleStyle += ` --marker-color: ${bColor}; color: #f8fafc; padding-left: 18px;`;
                            titleClass = 'block-title style-marker sidebar-target';
                        } else if (bStyle === 'inline') {
                            titleStyle += ` background-color: ${bColor}; color: ${textColor}; padding: 4px 12px; border-radius: 6px; display: inline-block; width: fit-content;`;
                        } else { // 'full'
                            titleStyle += ` background-color: ${bColor}; color: ${textColor}; padding: 4px 12px; border-radius: 6px; display: block; width: 100%; box-sizing: border-box;`;
                        }
                    }
                    
                    let headerHtml = '';
                    if (isUserText(block.content, 'Título Principal')) {
                        const dataColor = bColor ? ` data-block-color="${bColor}"` : '';
                        headerHtml += `<div class="${titleClass}" style="${titleStyle}"${dataColor}>${block.content}</div>`;
                    }
                    if (block.hasDescription && isUserText(block.description, 'Descrição opcional...')) {
                        headerHtml += `<div class="block-description" style="font-size: 13px; color: #94a3b8; margin-bottom: 8px; line-height: 1.5;">${block.description}</div>`;
                    }
                    
                    // .block is sticky when isSectionLevelBlock && isSticky — no child wrapper needed
                    htmlBlocks += headerHtml + imageHtml;
                } else if (block.type === 'desc') {
                    htmlBlocks += `<div class="block-desc" style="color: #cbd5e1; font-size: 15px; margin-bottom: 12px;">${block.desc || ''}</div>`;
                    htmlBlocks += imageHtml;
                } else if (block.type === 'section') {
                    const bColor = block.blockColor || '';
                    const bStyle = block.blockStyle || 'full';
                    const bSize = block.blockSize || 'medium';
                    const sizeMap = { 'small': '20px', 'medium': '25px', 'large': '33px' };
                    const fontSize = sizeMap[bSize] || '42px';
                    
                    let styleAttr = '';
                    let classAttr = 'class="sidebar-target"';

                    if (bStyle === 'border') {
                        const markerColor = bColor || '#475569';
                        styleAttr = `style="--marker-color: ${markerColor}; font-size: ${fontSize}; color: #f8fafc; margin: 0; line-height: 1.2; border-bottom: none; padding-bottom: 4px;"`;
                        classAttr = 'class="section-title style-marker sidebar-target"';
                    } else if (bStyle === 'inline') {
                        const bg = bColor ? `background-color: ${bColor};` : 'background-color: rgba(255, 255, 255, 0.05);';
                        const fg = bColor ? `color: ${getContrastYIQ(bColor)};` : 'color: #f8fafc;';
                        styleAttr = `style="${bg} ${fg} padding: 4px 12px; border-radius: 6px; font-size: ${fontSize}; margin: 0; line-height: 1.2; border-bottom: none; padding-bottom: 4px; display: inline-block; width: fit-content;"`;
                        classAttr = 'class="section-title sidebar-target"';
                    } else { // 'full'
                        const bg = bColor ? `background-color: ${bColor};` : 'background-color: rgba(255, 255, 255, 0.05);';
                        const fg = bColor ? `color: ${getContrastYIQ(bColor)};` : 'color: #f8fafc;';
                        styleAttr = `style="${bg} ${fg} padding: 4px 12px; border-radius: 6px; font-size: ${fontSize}; margin: 0; line-height: 1.2; border-bottom: none; padding-bottom: 4px; display: block; width: 100%;"`;
                        classAttr = 'class="section-title sidebar-target"';
                    }

                    const cleanStyle = styleAttr.replace('style="', '').slice(0, -1);

                    let wrapperStyle = bStyle === 'inline' && bColor
                        ? 'display: inline-flex; align-items: center; gap: 4px; margin-bottom: 8px; max-width: 100%;'
                        : 'display: flex; align-items: center; gap: 4px; width: 100%; margin-bottom: 8px;';
                        
                    const innerFlex = bStyle === 'inline' && bColor ? '' : 'flex: 1;';

                    let secHtml = '';
                    if (isUserText(block.question, 'Nova Secção')) {
                        const dataColorSec = bColor ? ` data-block-color="${bColor}"` : '';
                        const parsedClass = classAttr.replace('class="', '').slice(0, -1);
                        secHtml += `<div class="${parsedClass}" style="${cleanStyle}"${dataColorSec}>${block.question}</div>`;
                    }
                    if (block.hasDescription && isUserText(block.description, 'Descrição opcional...')) {
                        secHtml += `<div class="block-description" style="font-size: 13px; color: #94a3b8; margin-top: 4px; line-height: 1.5;">${block.description}</div>`;
                    }
                    let headerHtml = `<div style="display: flex; flex-direction: column; width: 100%; margin-bottom: 4px;">${secHtml}</div>`;

                    // .block is sticky when isSticky — no child wrapper needed
                    htmlBlocks += headerHtml;
                    htmlBlocks += imageHtml;
                }

                if (['choice-single', 'choice-multi'].includes(block.type)) {
                    hasInventory = true;
                    let blockContentHtml = '';
                    const showQuestion = isUserText(block.question, 'Nova Pergunta');
                    const showDesc = block.hasDescription && isUserText(block.description, 'Descrição opcional...');
                    
                    if (showQuestion || showDesc) {
                        blockContentHtml += `<div style="display: flex; flex-direction: column; margin-bottom: 12px;">`;
                        if (showQuestion) {
                            blockContentHtml += `<div class="block-question" style="margin-bottom: 0;">${block.question}${block.required ? '<span class="required">*</span>' : ''}</div>`;
                        }
                        if (showDesc) {
                            blockContentHtml += `<div class="block-description" style="font-size: 13px; color: #94a3b8; margin-top: 4px;">${block.description}</div>`;
                        }
                        blockContentHtml += `</div>`;
                    }
                    blockContentHtml += imageHtml;
                    blockContentHtml += `<div class="pill-options-container">`;
                    if (block.options && Array.isArray(block.options)) {
                        block.options.forEach((row, rowIdx) => {
                            blockContentHtml += `<div class="pill-row" style="margin-bottom: 4px;">`;
                            row.forEach((opt, colIdx) => {
                                const optColor = opt.color || block.pillColor || '#3b82f6';
                                const txtColor = getContrastYIQ(optColor);
                                blockContentHtml += `<div class="pill-btn" style="background-color: ${optColor}; color: ${txtColor}; border-color: transparent;" onclick="window.togglePill(this, ${block.type === 'choice-multi'})">${opt.text || 'Opção'}</div>`;
                            });
                            blockContentHtml += `</div>`;
                        });
                    }
                    blockContentHtml += `</div>`;
                    htmlBlocks += blockContentHtml;
                }

                if (block.type === 'counter') {
                    hasInventory = true;
                    // Normalize options
                    if (!block.options || !Array.isArray(block.options)) {
                        block.options = [[{ text: block.question || 'Item', target: block.target }]];
                    }

                    const bColor = block.blockColor || '';
                    const bStyle = block.blockStyle || 'full';
                    const bSize = block.blockSize || 'medium';
                    const sizeMap = { 'small': '20px', 'medium': '25px', 'large': '33px' };
                    const qFontSize = sizeMap[bSize] || '42px';
                    let qStyle = '';
                    let qClass = 'block-question sidebar-target';

                    if (bColor) {
                        const textColor = getContrastYIQ(bColor);
                        if (bStyle === 'border') {
                            qStyle = `style="--marker-color: ${bColor}; font-size: ${qFontSize} !important; color: #f8fafc; margin-bottom: 4px;"`;
                            qClass += ' style-marker';
                        } else {
                            const displayStyle = bStyle === 'inline' ? 'display: inline-block; width: fit-content;' : 'display: block; width: 100%;';
                            qStyle = `style="background-color: ${bColor}; color: ${textColor}; padding: 4px 12px; border-radius: 6px; font-size: ${qFontSize} !important; ${displayStyle}; margin-bottom: 4px;"`;
                        }
                    } else {
                        qStyle = `style="font-size: ${qFontSize} !important; margin-bottom: 4px;"`;
                    }
                    
                    let headerHtml = '';
                    const showQuestion = isUserText(block.question, 'Novo Item');
                    const showDesc = block.hasDescription && isUserText(block.description, 'Descrição opcional...');
                    
                    if (showQuestion) {
                        const dataColor = bColor ? ` data-block-color="${bColor}"` : '';
                        headerHtml += `<div class="${qClass}" ${qStyle}${dataColor}>${block.question}${block.required ? '<span class="required">*</span>' : ''}</div>`;
                    }
                    if (showDesc) {
                        headerHtml += `<div class="block-description" style="font-size: 13px; color: #94a3b8; margin-bottom: 8px; line-height: 1.5;">${block.description}</div>`;
                    }

                    let blockContentHtml = '';
                    if (isSticky) {
                        blockContentHtml += `<div class="counter-header-sticky" data-sticky-level="3" style="position: sticky; top: 0; z-index: 105; background-color: #0f172a; padding-top: 2px; padding-bottom: 2px; margin-bottom: 0; width: auto; margin-left: -40px; margin-right: -40px; padding-left: 40px; padding-right: 40px; box-sizing: border-box;">${headerHtml}${imageHtml}</div>`;
                    } else {
                        blockContentHtml += headerHtml;
                        blockContentHtml += imageHtml;
                    }
                    blockContentHtml += `<div class="inv-pill-container" style="margin-bottom: 0; margin-top: 4px; position: relative; z-index: 1;">`;
                    block.options.forEach((row, rowIdx) => {
                        blockContentHtml += `<div class="pill-row" style="margin-bottom: 4px;">`;
                        row.forEach((opt, colIdx) => {
                            const optText = opt.text || 'Item';
                            const optTarget = opt.target || 0;
                            const blockColor = block.pillColor || block.blockColor || '';
                            const optColor = (typeof opt === 'object' && opt.color) ? opt.color : blockColor;
                            const key = `${index}-${rowIdx}-${colIdx}`;
                            const val = window.pillCounters[key];
                            const valDisplay = val ?? '-';
                            let st = '';
                            if (val !== undefined) {
                                if (val < optTarget) st = 'status-red';
                                else if (val === optTarget) st = 'status-green';
                                else st = 'status-yellow';
                            }

                            let pillExtraStyle = '';
                            if (optColor) {
                                const borderPart = st ? '' : `border-color: ${optColor};`;
                                pillExtraStyle = `${borderPart} --pill-bg: ${optColor}; --pill-text: ${getContrastYIQ(optColor)};`;
                            }

                            blockContentHtml += `
                                <div class="inv-pill ${st}" id="inv-pill-${key}" style="${pillExtraStyle}"
                                     data-blockidx="${index}" data-rowidx="${rowIdx}" data-colidx="${colIdx}"
                                     onclick="window.incrementPill(${index}, ${rowIdx}, ${colIdx})"
                                     oncontextmenu="event.preventDefault(); window.decrementPill(${index}, ${rowIdx}, ${colIdx})"
