<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVP Portimão - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .logo-container {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 24px auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p {
            color: #94a3b8;
            margin-bottom: 32px;
            font-size: 15px;
        }

        .auth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: transparent;
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 16px;
        }

        .auth-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }

        .auth-btn img {
            width: 20px;
            height: 20px;
        }

        .auth-btn.google:hover {
            border-color: #ea4335;
            background: rgba(234, 67, 53, 0.1);
        }

        .auth-btn.microsoft:hover {
            border-color: #00a4ef;
            background: rgba(0, 164, 239, 0.1);
        }

        .notice {
            margin-top: 24px;
            font-size: 13px;
            color: #64748b;
            padding: 12px;
            background: rgba(255, 204, 0, 0.1);
            border: 1px solid rgba(255, 204, 0, 0.3);
            border-radius: 8px;
            text-align: left;
        }

        .notice i {
            color: #fbbf24;
            margin-right: 4px;
        }

        .email-form {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .email-form input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #f8fafc;
            font-family: inherit;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .email-form input:focus {
            border-color: #3b82f6;
        }

        .email-actions {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }

        .btn-primary,
        .btn-secondary {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0 16px 0;
            color: #64748b;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .divider::before {
            margin-right: 12px;
        }

        .divider::after {
            margin-left: 12px;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="logo-container">🚑</div>
        <h1>CVP Form Builder</h1>
        <p>Inicie sessão para gerir os seus formulários</p>

        <button class="auth-btn google" onclick="loginWithProvider('Google')">
            <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                    fill="#4285F4" />
                <path
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                    fill="#34A853" />
                <path
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                    fill="#FBBC05" />
                <path
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                    fill="#EA4335" />
            </svg>
            Continuar com Google
        </button>

        <button class="auth-btn microsoft" onclick="loginWithProvider('Outlook')">
            <svg viewBox="0 0 23 23" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                <path fill="#f35325" d="M1 1h10v10H1z" />
                <path fill="#81bc06" d="M12 1h10v10H12z" />
                <path fill="#05a6f0" d="M1 12h10v10H1z" />
                <path fill="#ffba08" d="M12 12h10v10H12z" />
            </svg>
            Continuar com Outlook
        </button>

        <div class="divider">ou com e-mail e password</div>

        <div class="email-form">
            <input type="email" id="email-input" placeholder="Endereço de E-mail" required>
            <input type="password" id="password-input" placeholder="Palavra-passe" required>
            <div class="email-actions">
                <button class="btn-primary" onclick="loginWithEmail()">Entrar</button>
                <button class="btn-secondary" onclick="registerWithEmail()">Criar Conta</button>
            </div>
        </div>

        <div class="notice">
            <i class="ph ph-info"></i> Ligado de forma segura via Google Firebase Auth.
        </div>
    </div>

    <script type="module">
        import { auth, googleProvider, microsoftProvider, signInWithPopup, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword } from './firebase-config.js';

        const noticeBox = document.querySelector('.notice');

        // Check if user is already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'dashboard.html';
            }
        });

        window.loginWithProvider = async (providerName) => {
            try {
                noticeBox.innerHTML = '<i class="ph ph-spinner ph-spin"></i> A iniciar sessão...';

                let provider = providerName === 'Google' ? googleProvider : microsoftProvider;
                const result = await signInWithPopup(auth, provider);

                // The onAuthStateChanged listener will handle the redirect
            } catch (error) {
                console.error("Login Error:", error);

                let errorMsg = "Ocorreu um erro no login.";
                if (error.code === 'auth/popup-closed-by-user') {
                    errorMsg = "A janela de login foi fechada antes de terminar.";
                } else if (error.code === 'auth/unauthorized-domain') {
                    errorMsg = "Domínio não autorizado. (Adicione o domínio na consola Firebase)";
                } else if (error.code === 'auth/internal-error') {
                    errorMsg = "Erro interno. Verifique se ativou o fornecedor de Auth na consola (Ex: Microsoft/Email).";
                }

                noticeBox.innerHTML = `<i class="ph ph-warning" style="color:#ef4444;"></i> <span style="color:#ef4444;">${errorMsg}</span>`;
            }
        };

        window.loginWithEmail = async () => {
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;

            if (!email || !password) {
                noticeBox.innerHTML = `<i class="ph ph-warning" style="color:#ef4444;"></i> <span style="color:#ef4444;">Preenche o e-mail e a palavra-passe.</span>`;
                return;
            }

            try {
                noticeBox.innerHTML = '<i class="ph ph-spinner ph-spin"></i> A entrar...';
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                console.error("Login Email Error:", error);
                let errorMsg = "E-mail ou palavra-passe incorretos.";
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    errorMsg = "E-mail ou palavra-passe incorretos.";
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg = "O formato do e-mail é inválido.";
                }
                noticeBox.innerHTML = `<i class="ph ph-warning" style="color:#ef4444;"></i> <span style="color:#ef4444;">${errorMsg}</span>`;
            }
        };

        window.registerWithEmail = async () => {
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;

            if (!email || !password) {
                noticeBox.innerHTML = `<i class="ph ph-warning" style="color:#ef4444;"></i> <span style="color:#ef4444;">Preenche o e-mail e a palavra-passe para registrar.</span>`;
                return;
            }
            if (password.length < 6) {
                noticeBox.innerHTML = `<i class="ph ph-warning" style="color:#ef4444;"></i> <span style="color:#ef4444;">A palavra-passe deve ter no mínimo 6 caracteres.</span>`;
                return;
            }

            try {
                noticeBox.innerHTML = '<i class="ph ph-spinner ph-spin"></i> A criar conta...';
                await createUserWithEmailAndPassword(auth, email, password);
            } catch (error) {
                console.error("Register Error:", error);
                let errorMsg = "Ocorreu um erro ao criar a conta.";
                if (error.code === 'auth/email-already-in-use') {
                    errorMsg = "Este e-mail já está em uso.";
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg = "O formato do e-mail é inválido.";
                } else if (error.code === 'auth/weak-password') {
                    errorMsg = "A palavra-passe é demasiado fraca.";
                }
                noticeBox.innerHTML = `<i class="ph ph-warning" style="color:#ef4444;"></i> <span style="color:#ef4444;">${errorMsg}</span>`;
            }
        };
    </script>
</body>

</html>
